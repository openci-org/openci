name: Save Secret File
description: Save a secret to a file. Supports base64-decoded or raw content.
branding:
  icon: lock
  color: purple

inputs:
  secret:
    description: Secret content. Base64-encoded by default, or raw when encoding is set to raw.
    required: true
  path:
    description: File path to save the content.
    required: true
  encoding:
    description: How to interpret the secret. base64 decodes the value before writing. raw writes the value as-is.
    required: false
    default: base64

runs:
  using: "node24"
  main: "dist/index.js"
