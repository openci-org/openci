name: 'OpenCI Flutter Setup'
description: 'Install and set up Flutter SDK'
branding:
  icon: 'download'
  color: 'blue'

inputs:
  flutter-version:
    description: 'Flutter version to install (e.g. 3.29.2, stable, beta)'
    required: false
    default: 'stable'
  channel:
    description: 'Flutter channel: stable, beta, or master'
    required: false
    default: 'stable'

runs:
  using: 'composite'
  steps:
    - name: Check if Flutter is already installed
      id: check-flutter
      shell: bash
      run: |
        if command -v flutter &> /dev/null; then
          echo "installed=true" >> $GITHUB_OUTPUT
          echo "Flutter already installed: $(flutter --version | head -1)"
        else
          echo "installed=false" >> $GITHUB_OUTPUT
        fi

    - name: Clone Flutter SDK
      if: steps.check-flutter.outputs.installed != 'true'
      shell: bash
      run: |
        if [ "${{ inputs.flutter-version }}" = "stable" ] || [ "${{ inputs.flutter-version }}" = "beta" ] || [ "${{ inputs.flutter-version }}" = "master" ]; then
          git clone https://github.com/flutter/flutter.git -b ${{ inputs.channel }} --depth 1 "$HOME/flutter"
        else
          git clone https://github.com/flutter/flutter.git -b ${{ inputs.flutter-version }} --depth 1 "$HOME/flutter"
        fi

    - name: Add Flutter to PATH
      if: steps.check-flutter.outputs.installed != 'true'
      shell: bash
      run: echo "$HOME/flutter/bin" >> $GITHUB_PATH

    - name: Run flutter doctor
      shell: bash
      run: flutter doctor -v

    - name: Disable analytics
      shell: bash
      run: flutter --disable-analytics
