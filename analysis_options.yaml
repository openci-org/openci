analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    require_trailing_commas: true
    unawaited_futures: true

formatter:
  trailing_commas: preserve

plugins:
  riverpod_lint: 3.1.2
  jaspr_lints:
    version: ^0.6.1
    diagnostics:
      prefer_html_components: true
      sort_children_last: true
      styles_ordering: true
