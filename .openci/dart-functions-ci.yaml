name: Dart Functions CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: open-ci-io/dart-setup@v1
        with:
          dart-version: "stable"

      - name: Patch workspace for Dart-only CI
        run: |
          # Remove Flutter-dependent packages from workspace so dart pub get
          # doesn't try to resolve Flutter SDK dependencies in Docker
          sed -i '/- apps\/dashboard/d' pubspec.yaml
          sed -i '/- apps\/landing_page/d' pubspec.yaml

      - name: Install dependencies
        run: cd firebase/dart_functions && dart pub get

      - name: Analyze
        run: cd firebase/dart_functions && dart analyze

      - name: Test
        run: cd firebase/dart_functions && dart test
