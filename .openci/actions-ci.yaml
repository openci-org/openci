name: Actions CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  save-secret-file:
    name: Save Secret File
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save base64 secret
        uses: ./actions/save-secret-file
        with:
          secret: aGVsbG8=
          path: /tmp/openci-action-test/base64.txt

      - name: Save raw secret
        uses: ./actions/save-secret-file
        with:
          secret: '{"ok":true}'
          path: /tmp/openci-action-test/raw.json
          encoding: raw

      - name: Verify saved files
        run: |
          set -euo pipefail
          test "$(cat /tmp/openci-action-test/base64.txt)" = "hello"
          test "$(cat /tmp/openci-action-test/raw.json)" = '{"ok":true}'

  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Flutter CD
            working_directory: actions/flutter-cd
            dist_files: dist/index.js

          - name: Flutter Pub Cache
            working_directory: actions/flutter-pub-cache
            dist_files: dist/index.js dist/licenses.txt

    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          working-directory: ${{ matrix.working_directory }}
          run-install: false

      - name: Install dependencies
        working-directory: ${{ matrix.working_directory }}
        run: vp i --frozen-lockfile

      - name: Check
        working-directory: ${{ matrix.working_directory }}
        run: vp check

      - name: Format check
        working-directory: ${{ matrix.working_directory }}
        run: vp fmt --check

      - name: Test
        working-directory: ${{ matrix.working_directory }}
        run: vp test

      - name: Typecheck
        working-directory: ${{ matrix.working_directory }}
        run: vp run typecheck

      - name: Build
        working-directory: ${{ matrix.working_directory }}
        run: vp run build

      - name: Verify generated dist is committed
        working-directory: ${{ matrix.working_directory }}
        run: |
          if git diff --quiet -- ${{ matrix.dist_files }}; then
            exit 0
          fi
          git diff --stat -- ${{ matrix.dist_files }}
          echo "::error::Generated dist files are out of date. Run vp run build in ${{ matrix.working_directory }} and commit the generated files."
          exit 1
