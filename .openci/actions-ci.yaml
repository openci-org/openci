name: Actions CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  flutter-cd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actions/flutter-cd
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          working-directory: actions/flutter-cd
          run-install: false

      - name: Install dependencies
        run: vp i --frozen-lockfile

      - name: Check
        run: vp check

      - name: Format check
        run: vp fmt --check

      - name: Test
        run: vp test

      - name: Typecheck
        run: vp run typecheck

      - name: Build
        run: vp run build

      - name: Verify generated dist is committed
        run: git diff --exit-code -- dist/index.js

  flutter-pub-cache:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actions/flutter-pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          working-directory: actions/flutter-pub-cache
          run-install: false

      - name: Install dependencies
        run: vp i --frozen-lockfile

      - name: Check
        run: vp check

      - name: Format check
        run: vp fmt --check

      - name: Test
        run: vp test

      - name: Build
        run: vp run build

      - name: Verify generated dist is committed
        run: git diff --exit-code -- dist/index.js dist/licenses.txt
