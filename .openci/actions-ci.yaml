name: Actions CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Flutter CD
            working_directory: actions/flutter-cd
            run_typecheck: true
            dist_files: dist/index.js
            
          - name: Flutter Pub Cache
            working_directory: actions/flutter-pub-cache
            run_typecheck: false
            dist_files: dist/index.js dist/licenses.txt
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          working-directory: ${{ matrix.working_directory }}
          run-install: false

      - name: Install dependencies
        working-directory: ${{ matrix.working_directory }}
        run: vp i --frozen-lockfile

      - name: Check
        working-directory: ${{ matrix.working_directory }}
        run: vp check

      - name: Format check
        working-directory: ${{ matrix.working_directory }}
        run: vp fmt --check

      - name: Test
        working-directory: ${{ matrix.working_directory }}
        run: vp test

      - name: Typecheck
        if: ${{ matrix.run_typecheck }}
        working-directory: ${{ matrix.working_directory }}
        run: vp run typecheck

      - name: Build
        working-directory: ${{ matrix.working_directory }}
        run: vp run build

      - name: Verify generated dist is committed
        working-directory: ${{ matrix.working_directory }}
        run: git diff --exit-code -- ${{ matrix.dist_files }}
