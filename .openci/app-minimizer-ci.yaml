name: App Minimizer Plus CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  ci_package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app_minimizer_plus
    steps:
      - uses: actions/checkout@v4

      - name: Restore Flutter pub cache
        uses: ./actions/flutter-pub-cache
        with:
          action: restore
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          storage-bucket: openci-b1b91.firebasestorage.app
          working-directory: packages/app_minimizer_plus

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Save Flutter pub cache
        if: always()
        uses: ./actions/flutter-pub-cache
        with:
          action: save
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          storage-bucket: openci-b1b91.firebasestorage.app
          working-directory: packages/app_minimizer_plus

  ci_example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app_minimizer_plus/example
    steps:
      - uses: actions/checkout@v4

      - name: Restore Flutter pub cache
        uses: ./actions/flutter-pub-cache
        with:
          action: restore
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          storage-bucket: openci-b1b91.firebasestorage.app
          working-directory: packages/app_minimizer_plus/example

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Save Flutter pub cache
        if: always()
        uses: ./actions/flutter-pub-cache
        with:
          action: save
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          storage-bucket: openci-b1b91.firebasestorage.app
          working-directory: packages/app_minimizer_plus/example

  e2e:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/app_minimizer_plus/example
    steps:
      - uses: actions/checkout@v4

      - name: Restore Flutter pub cache
        uses: ./actions/flutter-pub-cache
        with:
          action: restore
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          storage-bucket: openci-b1b91.firebasestorage.app
          working-directory: packages/app_minimizer_plus/example

      - name: Install dependencies
        run: flutter pub get

      - name: Start iOS Simulator
        run: |
          set -e
          device_id=$(xcrun simctl list devices | grep -E "iPhone 17 Pro" | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}" | head -n 1)
          if [ -z "$device_id" ]; then
            device_id=$(xcrun simctl list devices | grep -E "iPhone" | grep -v "unavailable" | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}" | head -n 1)
          fi
          echo "Booting simulator: $device_id"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id"

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli

      - name: Run Patrol E2E Tests
        run: |
          export PATH="$PATH":"$HOME/.pub-cache/bin"
          patrol test --target patrol_test/minimize_app_test.dart

      - name: Save Flutter pub cache
        if: always()
        uses: ./actions/flutter-pub-cache
        with:
          action: save
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          storage-bucket: openci-b1b91.firebasestorage.app
          working-directory: packages/app_minimizer_plus/example
