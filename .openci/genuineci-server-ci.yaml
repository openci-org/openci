name: GenuineCI Server CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/genuineci_server
    steps:
      - uses: actions/checkout@v4

      - name: Analyze genuineci_server
        run: flutter analyze
