name: Publish openci_shared to pub.dev

on:
  tag:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: openci-org/flutter-setup@v1
        with:
          flutter-version: "stable"

      - uses: openci-org/save-secret-file@v1
        with:
          secret: ${{ secrets.PUB_CREDENTIALS }}
          path: ".config/dart/pub-credentials.json"

      - name: Setup pub.dev credentials
        run: |
          mkdir -p ~/.config/dart
          cp .config/dart/pub-credentials.json ~/.config/dart/pub-credentials.json

      - name: Publish openci_shared
        run: |
          TAG="${OPENCI_TAG:-}"
          if [[ ! "$TAG" == shared-v* ]]; then
            echo "Tag '$TAG' does not match shared-v*, skipping publish"
            exit 0
          fi
          echo "Publishing for tag: $TAG"
          cd packages/openci_shared && flutter pub publish --force
