name: Web CI/CD

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          working-directory: apps/landing_page
          cache: true
          run-install: false

      - name: Install dependencies
        working-directory: apps/landing_page
        run: vp i --frozen-lockfile

      - name: Lint
        working-directory: apps/landing_page
        run: vp run lint

      - name: Build Next.js (static)
        working-directory: apps/landing_page
        run: vp run build

      - name: Sync build output to firebase/public_landing
        run: |
          rm -rf firebase/public_landing
          mkdir -p firebase/public_landing
          cp -R apps/landing_page/out/. firebase/public_landing/

      - name: Deploy to Firebase Hosting (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        working-directory: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          service_account_tmp="$(mktemp)"
          service_account_file="${service_account_tmp}.json"
          trap 'rm -f "$service_account_tmp" "$service_account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"
          unset FIREBASE_SERVICE_ACCOUNT

          firebase deploy \
            --only hosting:openci-b1b91 \
            --project openci-b1b91 \
            --non-interactive

      - name: Deploy to Firebase Hosting (preview)
        if: github.event_name == 'pull_request'
        working-directory: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          service_account_tmp="$(mktemp)"
          service_account_file="${service_account_tmp}.json"
          trap 'rm -f "$service_account_tmp" "$service_account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          
          # JSONの正当性を確認し、Base64エンコードされている場合は自動デコードする
          if ! python3 -c "import json; json.load(open('$service_account_file'))" 2>/dev/null; then
            echo "Credentials file is not valid JSON. Attempting Base64 decode..."
            if base64 -d "$service_account_file" > "${service_account_file}.decoded" 2>/dev/null; then
              if python3 -c "import json; json.load(open('${service_account_file}.decoded'))" 2>/dev/null; then
                echo "Successfully decoded credentials as Base64 JSON!"
                mv "${service_account_file}.decoded" "$service_account_file"
              else
                echo "Decoded file is still not valid JSON."
                rm -f "${service_account_file}.decoded"
              fi
            else
              echo "Failed to Base64 decode credentials."
            fi
          fi

          # サービスアカウントJSONのキー項目を安全に出力する（値は出さず、キー構造のみ確認）
          python3 -c "import json; data = json.load(open('$service_account_file')); print('Service account JSON keys:', list(data.keys())); print('Project ID in credentials:', data.get('project_id'))" 2>&1 || echo "Failed to analyze JSON keys"

          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"
          unset FIREBASE_SERVICE_ACCOUNT

          raw_channel_id="pr${RELEASE_PR_NUMBER:-${OPENCI_RUN_NUMBER:-preview}}-${RELEASE_HEAD_REF:-preview}"
          channel_id="$(printf '%s' "$raw_channel_id" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' \
            | cut -c 1-40 \
            | sed -E 's/^-+//; s/-+$//')"
          channel_id="${channel_id:-preview-${OPENCI_RUN_NUMBER:-local}}"

          set +e
          deploy_output="$(firebase hosting:channel:deploy "$channel_id" \
            --only hosting:openci-b1b91 \
            --expires 3h \
            --project openci-b1b91 \
            --json \
            --non-interactive 2>&1)"
          status=$?
          set -e

          printf 'Firebase output:\n%s\n' "$deploy_output"

          if [ $status -ne 0 ]; then
            exit $status
          fi

          preview_urls="$(printf '%s' "$deploy_output" | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          result = data.get("result") or {}
          urls = [
              value.get("url")
              for value in result.values()
              if isinstance(value, dict) and value.get("url")
          ]
          print("\n".join(urls))
          ')"
          if [ -n "$preview_urls" ]; then
            {
              echo "Firebase Hosting preview:"
              printf '%s\n' "$preview_urls"
            } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
