name: Flutter Dashboard CI/CD (iOS, macOS & Web)

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: openci-org/save-secret-file@v1
        with:
          secret: ${{ secrets.FIREBASE_OPTIONS }}
          path: "apps/dashboard/lib/firebase_options.dart"
      - name: Analyze
        working-directory: apps/dashboard
        run: flutter analyze

  deploy-ios:
    needs: [ci]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: openci-org/save-secret-file@v1
        with:
          secret: ${{ secrets.FIREBASE_OPTIONS }}
          path: "apps/dashboard/lib/firebase_options.dart"

      - uses: openci-org/save-secret-file@v1
        with:
          secret: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_IOS }}
          path: "apps/dashboard/ios/Runner/GoogleService-Info.plist"

      - name: Prepare stable iOS build workspace
        run: |
          set -euo pipefail

          stable_workspace="${HOME}/openci-workspaces/openci-org-openci-ios"
          rm -rf "$stable_workspace"
          mkdir -p "$(dirname "$stable_workspace")"
          rsync -a --delete --exclude ".git" "${GITHUB_WORKSPACE}/" "$stable_workspace/"
          echo "Stable iOS build workspace: $stable_workspace"

      - name: Restore iOS Xcode compilation cache
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: .openci/scripts/xcode-compilation-cache.sh restore ios

      - name: Build iOS IPA for Firebase App Distribution
        if: github.event_name == 'pull_request'
        uses: openci-org/flutter-cd@0888e2e278dcec6b5b3ed055e911fa01fe46c8b4
        id: ios-build-fad
        env:
          FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_CACHING: "YES"
        with:
          platform: "ios"
          working-directory: "/Users/admin/openci-workspaces/openci-org-openci-ios/apps/dashboard"
          swift-package-manager: "enabled"
          build-number: ${{ env.OPENCI_RUN_NUMBER }}
          build-args: "--dart-define=REVENUE_CAT_API_KEY=${{ secrets.REVENUE_CAT_API_KEY }} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}"
          distribution-method: "ad-hoc"
          upload-to-app-store-connect: "false"
          certificate-private-key: ${{ secrets.OPENCI_CERTIFICATE_PRIVATE_KEY }}
          asc-key-id: ${{ secrets.OPENCI_ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.OPENCI_ASC_ISSUER_ID }}
          asc-private-key: ${{ secrets.OPENCI_ASC_PRIVATE_KEY }}

      - name: Upload iOS IPA to Firebase App Distribution
        if: github.event_name == 'pull_request'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_APP_DISTRIBUTION_GROUPS: ${{ secrets.FIREBASE_APP_DISTRIBUTION_GROUPS }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_HEAD_REF: ${{ github.head_ref }}
          RELEASE_BASE_REF: ${{ github.base_ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
          release_notes_file="$(mktemp)"
          trap 'rm -f /tmp/firebase-service-account.json "$release_notes_file"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json

          {
            echo "OpenCI build"
            echo "Trigger: ${RELEASE_EVENT_NAME:-unknown}"

            echo "Pull Request: #${RELEASE_PR_NUMBER:-unknown}"
            [ -n "${RELEASE_HEAD_REF:-}" ] && echo "Head branch: $RELEASE_HEAD_REF"
            [ -n "${RELEASE_BASE_REF:-}" ] && echo "Base branch: $RELEASE_BASE_REF"

            [ -n "${RELEASE_SHA:-}" ] && echo "Commit: $RELEASE_SHA"
          } > "$release_notes_file"

          firebase appdistribution:distribute "${{ steps.ios-build-fad.outputs.ipa-path }}" \
            --app "$FIREBASE_IOS_APP_ID" \
            --groups "$FIREBASE_APP_DISTRIBUTION_GROUPS" \
            --release-notes-file "$release_notes_file" \
            --non-interactive

      - name: Save iOS Xcode compilation cache
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: .openci/scripts/xcode-compilation-cache.sh save ios

      - name: Build and upload iOS IPA to TestFlight
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: openci-org/flutter-cd@0888e2e278dcec6b5b3ed055e911fa01fe46c8b4
        env:
          FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_CACHING: "YES"
        with:
          platform: "ios"
          working-directory: "/Users/admin/openci-workspaces/openci-org-openci-ios/apps/dashboard"
          swift-package-manager: "enabled"
          build-number: ${{ env.OPENCI_RUN_NUMBER }}
          build-args: "--dart-define=REVENUE_CAT_API_KEY=${{ secrets.REVENUE_CAT_API_KEY }} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}"
          distribution-method: "app-store"
          upload-to-app-store-connect: "true"
          certificate-private-key: ${{ secrets.OPENCI_CERTIFICATE_PRIVATE_KEY }}
          asc-key-id: ${{ secrets.OPENCI_ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.OPENCI_ASC_ISSUER_ID }}
          asc-private-key: ${{ secrets.OPENCI_ASC_PRIVATE_KEY }}

      - name: Save iOS Xcode compilation cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: .openci/scripts/xcode-compilation-cache.sh save ios

      - name: Report iOS Xcode compilation cache
        if: always()
        run: |
          set -euo pipefail

          cache_dir="${HOME}/Library/Developer/Xcode/DerivedData/CompilationCache.noindex"
          if [ ! -d "$cache_dir" ]; then
            echo "Xcode compilation cache not found: $cache_dir"
            exit 0
          fi

          echo "Xcode compilation cache:"
          du -sh "$cache_dir"
          find "$cache_dir" -type f | wc -l | awk '{ print "File count: " $1 }'

  build-macos:
    needs: [ci]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: openci-org/save-secret-file@v1
        with:
          secret: ${{ secrets.FIREBASE_OPTIONS }}
          path: "apps/dashboard/lib/firebase_options.dart"

      - uses: openci-org/save-secret-file@v1
        with:
          secret: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_MACOS }}
          path: "apps/dashboard/macos/Runner/GoogleService-Info.plist"

      - name: Configure Sparkle update settings
        env:
          OPENCI_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.OPENCI_SPARKLE_PUBLIC_ED_KEY }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ -z "${OPENCI_SPARKLE_PUBLIC_ED_KEY:-}" ]; then
            if [ "${RELEASE_EVENT_NAME}" = "push" ] && [ "${RELEASE_REF}" = "refs/heads/develop" ]; then
              echo "OPENCI_SPARKLE_PUBLIC_ED_KEY is required for develop macOS builds" >&2
              exit 1
            fi
            echo "OPENCI_SPARKLE_PUBLIC_ED_KEY is not set; macOS updater will be inert for this build"
            exit 0
          fi

          {
            echo ""
            echo "SPARKLE_PUBLIC_ED_KEY = ${OPENCI_SPARKLE_PUBLIC_ED_KEY}"
          } >> apps/dashboard/macos/Runner/Configs/AppInfo.xcconfig

      - name: Prepare stable macOS build workspace
        run: |
          set -euo pipefail

          stable_workspace="${HOME}/openci-workspaces/openci-org-openci-macos"
          rm -rf "$stable_workspace"
          mkdir -p "$(dirname "$stable_workspace")"
          rsync -a --delete --exclude ".git" "${GITHUB_WORKSPACE}/" "$stable_workspace/"
          echo "Stable macOS build workspace: $stable_workspace"

      - name: Restore macOS Xcode compilation cache
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: .openci/scripts/xcode-compilation-cache.sh restore macos

      - id: build_macos
        uses: openci-org/flutter-cd@0888e2e278dcec6b5b3ed055e911fa01fe46c8b4
        env:
          FLUTTER_XCODE_COMPILATION_CACHE_ENABLE_CACHING: "YES"
        with:
          platform: "macos"
          working-directory: "/Users/admin/openci-workspaces/openci-org-openci-macos/apps/dashboard"
          swift-package-manager: "enabled"
          build-number: ${{ env.OPENCI_RUN_NUMBER }}
          build-args: "--dart-define=REVENUE_CAT_API_KEY=${{ secrets.REVENUE_CAT_API_KEY }} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}"
          asc-key-id: ${{ secrets.OPENCI_ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.OPENCI_ASC_ISSUER_ID }}
          asc-private-key: ${{ secrets.OPENCI_ASC_PRIVATE_KEY }}
          developer-id-certificate-p12: ${{ secrets.OPENCI_DEVELOPER_ID_CERTIFICATE_P12 }}
          developer-id-certificate-password: ${{ secrets.OPENCI_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          macos-entitlements-path: "macos/Runner/DeveloperId.entitlements"
          macos-provisioning-profile: "true"
          artifact-name: "OpenCI-dashboard-macos"

      - name: Report macOS Xcode compilation cache
        if: always()
        run: |
          set -euo pipefail

          cache_dir="${HOME}/Library/Developer/Xcode/DerivedData/CompilationCache.noindex"
          if [ ! -d "$cache_dir" ]; then
            echo "Xcode compilation cache not found: $cache_dir"
            exit 0
          fi

          echo "Xcode compilation cache:"
          du -sh "$cache_dir"
          find "$cache_dir" -type f | wc -l | awk '{ print "File count: " $1 }'

      - name: Verify Sparkle helper signatures
        run: |
          set -euo pipefail

          artifact_path="${{ steps.build_macos.outputs['artifact-path'] }}"
          verify_dir="$(mktemp -d)"
          entitlements_path="$(mktemp)"
          trap 'rm -rf "$verify_dir" "$entitlements_path"' EXIT

          ditto -x -k "$artifact_path" "$verify_dir"
          app_path="$(find "$verify_dir" -maxdepth 2 -type d -name "*.app" | head -n 1)"
          if [ -z "$app_path" ]; then
            echo "Could not find a macOS .app inside ${artifact_path}" >&2
            exit 1
          fi

          sparkle_root="${app_path}/Contents/Frameworks/Sparkle.framework/Versions/Current"
          if [ ! -e "$sparkle_root" ]; then
            echo "Sparkle.framework was not found in ${app_path}" >&2
            exit 1
          fi

          helpers=(
            "${sparkle_root}/Autoupdate"
            "${sparkle_root}/Updater.app"
            "${sparkle_root}/XPCServices/Installer.xpc"
            "${sparkle_root}/XPCServices/Downloader.xpc"
          )

          restricted_entitlement_pattern='<key>(com.apple.application-identifier|com.apple.developer.aps-environment|com.apple.developer.associated-domains|keychain-access-groups)</key>'
          for helper in "${helpers[@]}"; do
            if [ ! -e "$helper" ]; then
              echo "Sparkle helper was not found: ${helper}" >&2
              exit 1
            fi

            codesign --verify --strict --verbose=2 "$helper"
            if codesign -d --entitlements :- "$helper" > "$entitlements_path" 2>/dev/null; then
              if grep -Eq "$restricted_entitlement_pattern" "$entitlements_path"; then
                echo "Sparkle helper has app/provisioning entitlements and will fail to launch: ${helper}" >&2
                cat "$entitlements_path" >&2
                exit 1
              fi
            fi
          done

          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Upload macOS artifact to Firebase Storage
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OPENCI_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.OPENCI_SPARKLE_PRIVATE_ED_KEY }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          artifact_path="${{ steps.build_macos.outputs['artifact-path'] }}"
          if [ ! -f "$artifact_path" ]; then
            echo "Artifact not found: $artifact_path" >&2
            exit 1
          fi

          service_account_file="$(mktemp)"
          private_key_file="$(mktemp)"
          signing_input_file="$(mktemp)"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"

          bucket="$(sed -n "s/.*storageBucket: '\([^']*\)'.*/\1/p" apps/dashboard/lib/firebase_options.dart | head -n 1)"
          if [ -z "$bucket" ]; then
            echo "Could not read storageBucket from firebase_options.dart" >&2
            exit 1
          fi

          object_names=()
          if [ "${RELEASE_EVENT_NAME}" = "pull_request" ]; then
            object_names+=("artifacts/openci-dashboard/macos/pr/${RELEASE_PR_NUMBER}/${OPENCI_RUN_NUMBER}/OpenCI-dashboard-macos.zip")
          elif [ "${RELEASE_EVENT_NAME}" = "push" ] && [ "${RELEASE_REF}" = "refs/heads/develop" ]; then
            object_names+=("artifacts/openci-dashboard/macos/develop/${OPENCI_RUN_NUMBER}/OpenCI-dashboard-macos.zip")
            object_names+=("artifacts/openci-dashboard/macos/develop/latest/OpenCI-dashboard-macos.zip")
          else
            object_names+=("artifacts/openci-dashboard/macos/${RELEASE_EVENT_NAME}/${OPENCI_RUN_NUMBER}/OpenCI-dashboard-macos.zip")
          fi

          client_email="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["client_email"])' "$service_account_file")"
          python3 -c 'import json, sys; open(sys.argv[2], "w").write(json.load(open(sys.argv[1]))["private_key"])' "$service_account_file" "$private_key_file"

          jwt_header="$(python3 -c 'import base64, json; print(base64.urlsafe_b64encode(json.dumps({"alg":"RS256","typ":"JWT"}, separators=(",", ":")).encode()).decode().rstrip("="))')"
          jwt_payload="$(python3 - "$client_email" <<'PY'
          import base64
          import json
          import sys
          import time

          now = int(time.time())
          payload = {
              "iss": sys.argv[1],
              "scope": "https://www.googleapis.com/auth/devstorage.full_control",
              "aud": "https://oauth2.googleapis.com/token",
              "iat": now,
              "exp": now + 3600,
          }
          print(base64.urlsafe_b64encode(json.dumps(payload, separators=(",", ":")).encode()).decode().rstrip("="))
          PY
          )"
          printf '%s.%s' "$jwt_header" "$jwt_payload" > "$signing_input_file"
          jwt_signature="$(openssl dgst -sha256 -sign "$private_key_file" "$signing_input_file" | python3 -c 'import base64, sys; print(base64.urlsafe_b64encode(sys.stdin.buffer.read()).decode().rstrip("="))')"
          jwt_assertion="${jwt_header}.${jwt_payload}.${jwt_signature}"

          access_token="$(curl -fsS -X POST "https://oauth2.googleapis.com/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" \
            --data-urlencode "assertion=${jwt_assertion}" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')"

          upload_object() {
            local object_name="$1"
            local encoded_object_name
            encoded_object_name="$(python3 - "$object_name" <<'PY'
          import sys
          import urllib.parse

          print(urllib.parse.quote(sys.argv[1], safe=""))
          PY
            )"

            curl -fsS -X POST \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/zip" \
              --data-binary "@${artifact_path}" \
              "https://storage.googleapis.com/upload/storage/v1/b/${bucket}/o?uploadType=media&name=${encoded_object_name}" \
              > /dev/null

            if [ "$object_name" = "artifacts/openci-dashboard/macos/develop/latest/OpenCI-dashboard-macos.zip" ]; then
              download_token="4b4e0ed8-e11c-46b8-9d10-cf1f3c8b926c"
            else
              download_token="$(uuidgen)"
            fi
            curl -fsS -X PATCH \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json" \
              --data "{\"metadata\":{\"firebaseStorageDownloadTokens\":\"${download_token}\"},\"contentType\":\"application/zip\"}" \
              "https://storage.googleapis.com/storage/v1/b/${bucket}/o/${encoded_object_name}" \
              > /dev/null

            echo "Uploaded macOS artifact: gs://${bucket}/${object_name}"
            echo "Download URL: https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encoded_object_name}?alt=media&token=${download_token}"
          }

          for object_name in "${object_names[@]}"; do
            upload_object "$object_name"
          done

          if [ "${RELEASE_EVENT_NAME}" = "push" ] && [ "${RELEASE_REF}" = "refs/heads/develop" ]; then
            if [ -z "${OPENCI_SPARKLE_PRIVATE_ED_KEY:-}" ]; then
              echo "OPENCI_SPARKLE_PRIVATE_ED_KEY is required to generate the macOS appcast" >&2
              exit 1
            fi

            sparkle_tmp_dir="$(mktemp -d)"
            sparkle_version="${OPENCI_SPARKLE_VERSION:-2.9.1}"
            curl -fsSL \
              "https://github.com/sparkle-project/Sparkle/releases/download/${sparkle_version}/Sparkle-${sparkle_version}.tar.xz" \
              -o "${sparkle_tmp_dir}/sparkle.tar.xz"
            tar -xJf "${sparkle_tmp_dir}/sparkle.tar.xz" -C "${sparkle_tmp_dir}"
            sign_update="$(find "${sparkle_tmp_dir}" -path "*/bin/sign_update" -type f | head -n 1)"
            if [ -z "${sign_update}" ]; then
              echo "Sparkle sign_update tool was not found" >&2
              exit 1
            fi

            latest_zip_object_name="artifacts/openci-dashboard/macos/develop/latest/OpenCI-dashboard-macos.zip"
            latest_zip_encoded_object_name="$(python3 - "$latest_zip_object_name" <<'PY'
          import sys
          import urllib.parse

          print(urllib.parse.quote(sys.argv[1], safe=""))
          PY
            )"
            latest_zip_url="https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${latest_zip_encoded_object_name}?alt=media&token=4b4e0ed8-e11c-46b8-9d10-cf1f3c8b926c"
            appcast_token="adfb1bbd-98ac-4d7d-8bfe-df57403ce6b0"
            appcast_object_name="artifacts/openci-dashboard/macos/develop/latest/appcast.xml"
            appcast_path="$(mktemp)"
            signature_attributes="$(printf '%s' "${OPENCI_SPARKLE_PRIVATE_ED_KEY}" | "${sign_update}" --ed-key-file - "${artifact_path}")"
            short_version="$(python3 - <<'PY'
          import re

          with open("apps/dashboard/pubspec.yaml", encoding="utf-8") as f:
              match = re.search(r"^version:\s*([^+\s]+)", f.read(), re.MULTILINE)
          print(match.group(1) if match else "1.0.0")
          PY
            )"
            published_at="$(date -u +"%a, %d %b %Y %H:%M:%S %z")"

            python3 - "$appcast_path" "$latest_zip_url" "$signature_attributes" "$OPENCI_RUN_NUMBER" "$short_version" "$published_at" <<'PY'
          import html
          import sys

          output_path, zip_url, signature_attributes, version, short_version, published_at = sys.argv[1:]
          xml = f'''<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>OpenCI macOS updates</title>
              <description>OpenCI dashboard macOS updates</description>
              <language>ja</language>
              <item>
                <title>OpenCI {html.escape(short_version)} ({html.escape(version)})</title>
                <pubDate>{html.escape(published_at)}</pubDate>
                <sparkle:version>{html.escape(version)}</sparkle:version>
                <sparkle:shortVersionString>{html.escape(short_version)}</sparkle:shortVersionString>
                <enclosure url="{html.escape(zip_url)}" {signature_attributes} type="application/zip"/>
              </item>
            </channel>
          </rss>
          '''
          with open(output_path, "w", encoding="utf-8") as f:
              f.write(xml)
          PY

            appcast_encoded_object_name="$(python3 - "$appcast_object_name" <<'PY'
          import sys
          import urllib.parse

          print(urllib.parse.quote(sys.argv[1], safe=""))
          PY
            )"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/rss+xml" \
              --data-binary "@${appcast_path}" \
              "https://storage.googleapis.com/upload/storage/v1/b/${bucket}/o?uploadType=media&name=${appcast_encoded_object_name}" \
              > /dev/null
            curl -fsS -X PATCH \
              -H "Authorization: Bearer ${access_token}" \
              -H "Content-Type: application/json" \
              --data "{\"metadata\":{\"firebaseStorageDownloadTokens\":\"${appcast_token}\"},\"contentType\":\"application/rss+xml\"}" \
              "https://storage.googleapis.com/storage/v1/b/${bucket}/o/${appcast_encoded_object_name}" \
              > /dev/null

            echo "Uploaded macOS appcast: gs://${bucket}/${appcast_object_name}"
            echo "Appcast URL: https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${appcast_encoded_object_name}?alt=media&token=${appcast_token}"
            rm -rf "${sparkle_tmp_dir}" "${appcast_path}"
          fi

          rm -f "$service_account_file" "$private_key_file" "$signing_input_file"

      - name: Save macOS Xcode compilation cache
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: .openci/scripts/xcode-compilation-cache.sh save macos

  deploy-web:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: openci-org/save-secret-file@v1
        with:
          secret: ${{ secrets.FIREBASE_OPTIONS }}
          path: "apps/dashboard/lib/firebase_options.dart"

      - name: Build Flutter web
        working-directory: apps/dashboard
        env:
          REVENUE_CAT_API_KEY: ${{ secrets.REVENUE_CAT_API_KEY }}
          REVENUE_CAT_WEB_API_KEY: ${{ secrets.REVENUE_CAT_WEB_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          BUILD_UPDATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_SHA="$(git rev-parse --short HEAD)"

          flutter build web \
            --no-wasm-dry-run \
            --dart-define=REVENUE_CAT_API_KEY="$REVENUE_CAT_API_KEY" \
            --dart-define=REVENUE_CAT_WEB_API_KEY="$REVENUE_CAT_WEB_API_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=OPENCI_BUILD_UPDATED_AT="$BUILD_UPDATED_AT" \
            --dart-define=OPENCI_BUILD_SHA="$BUILD_SHA"

      - name: Deploy to Firebase Hosting (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        working-directory: apps/dashboard
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          service_account_file="$(mktemp)"
          trap 'rm -f "$service_account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"

          firebase deploy \
            --only hosting \
            --project openci-b1b91 \
            --non-interactive

      - name: Deploy to Firebase Hosting (preview)
        if: github.event_name == 'pull_request'
        working-directory: apps/dashboard
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          service_account_file="$(mktemp)"
          trap 'rm -f "$service_account_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$service_account_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"

          raw_channel_id="pr${RELEASE_PR_NUMBER:-${OPENCI_RUN_NUMBER:-preview}}-${RELEASE_HEAD_REF:-preview}"
          channel_id="$(printf '%s' "$raw_channel_id" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' \
            | cut -c 1-40 \
            | sed -E 's/^-+//; s/-+$//')"
          channel_id="${channel_id:-preview-${OPENCI_RUN_NUMBER:-local}}"

          deploy_output="$(firebase hosting:channel:deploy "$channel_id" \
            --expires 3h \
            --project openci-b1b91 \
            --json \
            --non-interactive)"
          printf '%s\n' "$deploy_output"

          preview_urls="$(printf '%s' "$deploy_output" | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          result = data.get("result") or {}
          urls = [
              value.get("url")
              for value in result.values()
              if isinstance(value, dict) and value.get("url")
          ]
          print("\n".join(urls))
          ')"
          if [ -n "$preview_urls" ]; then
            {
              echo "Firebase Hosting preview:"
              printf '%s\n' "$preview_urls"
            } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
