name: Landing Page CI/CD (Web)

on:
  push:
    branches:
      - develop
      
  pull_request:
    branches:
      - develop

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: cd apps/landing_page && npm ci
        
      - name: Lint
        run: cd apps/landing_page && npm run lint

      - name: Build Next.js (static)
        run: cd apps/landing_page && npm run build

      - name: Sync build output to firebase/public
        run: |
          rm -rf firebase/public
          mkdir -p firebase/public
          cp -R apps/landing_page/out/. firebase/public/

      - uses: openci-org/save-secret-file@v1
        with:
          secret: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          path: "firebase/service-account.json"
          encoding: raw

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting (production)
        if: github.event_name == 'push'
        working-directory: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase/service-account.json
        run: firebase deploy --only hosting --non-interactive
        
      - name: Deploy to Firebase Hosting (preview)
        if: github.event_name == 'pull_request'
        working-directory: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase/service-account.json
        run: firebase hosting:channel:deploy pr-${{ github.event.pull_request.number }} --expires 7d --non-interactive
