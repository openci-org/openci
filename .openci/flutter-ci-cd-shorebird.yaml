name: Flutter Dashboard CI/CD (iOS, macOS & Web) with Shorebird

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./actions/save-secret-file
        with:
          secret: ${{ secrets.FIREBASE_OPTIONS }}
          path: "apps/dashboard/lib/firebase_options.dart"

      - name: Analyze
        working-directory: apps/dashboard
        run: flutter analyze

  deploy-ios:
    needs: [ci]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./actions/save-secret-file
        with:
          secret: ${{ secrets.FIREBASE_OPTIONS }}
          path: "apps/dashboard/lib/firebase_options.dart"

      - uses: ./actions/save-secret-file
        with:
          secret: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_IOS }}
          path: "apps/dashboard/ios/Runner/GoogleService-Info.plist"

      - name: Build iOS IPA for OpenCI OTA
        if: github.event_name == 'pull_request'
        uses: ./actions/flutter-cd
        id: ios-build-ota
        with:
          platform: "ios"
          working-directory: "apps/dashboard"
          swift-package-manager: "enabled"
          patch-flutter-ios-distribution-signing: "false"
          build-number: ${{ secrets.OPENCI_RUN_NUMBER }}
          build-args: >-
            --dart-define=REVENUE_CAT_API_KEY=${{ secrets.REVENUE_CAT_API_KEY }}
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            --dart-define=OPENCI_SERVER_URL=${{ secrets.OPENCI_SERVER_URL }}
          distribution-method: "ad-hoc"
          upload-to-app-store-connect: "false"
          certificate-private-key: ${{ secrets.OPENCI_CERTIFICATE_PRIVATE_KEY }}
          asc-key-id: ${{ secrets.OPENCI_ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.OPENCI_ASC_ISSUER_ID }}
          asc-private-key: ${{ secrets.OPENCI_ASC_PRIVATE_KEY }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ota-distribution: "true"
          firebase-service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          shorebird: "true"
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}
          flutter-version: "3.41.9"

      - name: Build and upload iOS IPA to TestFlight
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: ./actions/flutter-cd
        with:
          platform: "ios"
          working-directory: "apps/dashboard"
          swift-package-manager: "enabled"
          patch-flutter-ios-distribution-signing: "false"
          build-number: ${{ secrets.OPENCI_RUN_NUMBER }}
          build-args: >-
            --dart-define=REVENUE_CAT_API_KEY=${{ secrets.REVENUE_CAT_API_KEY }}
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            --dart-define=OPENCI_SERVER_URL=${{ secrets.OPENCI_SERVER_URL }}
          distribution-method: "app-store"
          upload-to-app-store-connect: "true"
          certificate-private-key: ${{ secrets.OPENCI_CERTIFICATE_PRIVATE_KEY }}
          asc-key-id: ${{ secrets.OPENCI_ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.OPENCI_ASC_ISSUER_ID }}
          asc-private-key: ${{ secrets.OPENCI_ASC_PRIVATE_KEY }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          shorebird: "true"
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}
          flutter-version: "3.41.9"
          testflight-internal-testing: "true"

  deploy-android:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./actions/save-secret-file
        with:
          secret: ${{ secrets.FIREBASE_OPTIONS }}
          path: "apps/dashboard/lib/firebase_options.dart"

      - name: Create dummy google-services.json for build validation
        run: |
          mkdir -p apps/dashboard/android/app
          cat << 'EOF' > apps/dashboard/android/app/google-services.json
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "openci-b1b91",
              "storage_bucket": "openci-b1b91.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "org.openci.dashboard.prod"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy-api-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Android APK for OpenCI OTA
        if: github.event_name == 'pull_request'
        uses: ./actions/flutter-cd
        with:
          platform: "android"
          working-directory: "apps/dashboard"
          build-number: ${{ secrets.OPENCI_RUN_NUMBER }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ota-distribution: "true"
          shorebird: "true"
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}
          flutter-version: "3.41.9"

      - name: Build and deploy Android App Bundle to Google Play
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: ./actions/flutter-cd
        with:
          platform: "android"
          working-directory: "apps/dashboard"
          build-number: ${{ secrets.OPENCI_RUN_NUMBER }}
          android-keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          android-keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android-key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          android-key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          google-play-service-account-json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          google-play-track: "internal"
          shorebird: "true"
          shorebird-token: ${{ secrets.SHOREBIRD_TOKEN }}
          flutter-version: "3.41.9"
