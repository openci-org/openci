name: Flutter Pub Cache Action CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

defaults:
  run:
    working-directory: actions/flutter-pub-cache

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          working-directory: actions/flutter-pub-cache
          run-install: false

      - name: Install dependencies
        run: vp i

      - name: Check
        run: vp check

      - name: Format check
        run: vp fmt --check

      - name: Test
        run: vp test

      - name: Build
        run: vp run build

      - name: Verify generated dist is committed
        run: git diff --exit-code -- dist/index.js dist/licenses.txt
