name: TS Workspace CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          working-directory: "."
          run-install: false

      - name: Install dependencies
        run: vp i --frozen-lockfile

      - name: Check all workspaces
        run: vp run -r check

      - name: Test TS workspace units
        run: vp run -w test
