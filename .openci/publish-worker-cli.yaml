name: Publish Worker CLI to pub.dev

on:
  tag:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: open-ci-io/flutter-setup@v1
        with:
          flutter-version: "stable"

      - uses: open-ci-io/save-secret-file@v1
        with:
          secret: ${{ secrets.PUB_CREDENTIALS }}
          path: ".config/dart/pub-credentials.json"

      - name: Setup pub.dev credentials
        run: |
          mkdir -p ~/.config/dart
          cp .config/dart/pub-credentials.json ~/.config/dart/pub-credentials.json

      - name: Publish openci_worker_cli
        run: |
          TAG="${OPENCI_TAG:-}"
          if [[ ! "$TAG" == worker-v* ]]; then
            echo "Tag '$TAG' does not match worker-v*, skipping publish"
            exit 0
          fi
          echo "Publishing for tag: $TAG"
          cd apps/openci_worker_cli && dart pub publish --force
