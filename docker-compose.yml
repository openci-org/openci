services:
  db:
    image: postgres:16-alpine
    container_name: openci-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openci"]
      interval: 2s
      timeout: 2s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/openci_server/Dockerfile
    container_name: openci-server
    restart: unless-stopped
    environment:
      HOST: any
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openci}}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY environment variable is required}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY environment variable is required}

      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/firebase-service-account.json

      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:?GITHUB_API_BASE_URL environment variable is required}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?GITHUB_APP_ID environment variable is required}
      GITHUB_PRIVATE_KEY_PATH: /app/credentials/github-private-key.pem
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET environment variable is required}

      LOKI_URL: ${LOKI_URL:-http://loki:3100}

      ORCHARD_API_URL: ${ORCHARD_API_URL:?ORCHARD_API_URL environment variable is required}
      ORCHARD_SERVICE_ACCOUNT_NAME: ${ORCHARD_SERVICE_ACCOUNT_NAME:?ORCHARD_SERVICE_ACCOUNT_NAME environment variable is required}
      ORCHARD_SERVICE_ACCOUNT_TOKEN: ${ORCHARD_SERVICE_ACCOUNT_TOKEN:?ORCHARD_SERVICE_ACCOUNT_TOKEN environment variable is required}

      SENTRY_DSN_SERVER: ${SENTRY_DSN_SERVER:-}
    volumes:
      - ./firebase-service-account.json:/app/credentials/firebase-service-account.json:ro
      - ./github-private-key.pem:/app/credentials/github-private-key.pem:ro
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  build-job-planner:
    build:
      context: .
      dockerfile: apps/build_job_planner/Dockerfile
    container_name: openci-build-job-planner
    restart: unless-stopped
    environment:
      OPENCI_SERVER_URL: http://server:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY environment variable is required}
      SENTRY_DSN: ${SENTRY_DSN_BUILD_JOB_PLANNER:-}
    depends_on:
      server:
        condition: service_healthy

  build-job-dispatcher:
    build:
      context: .
      dockerfile: apps/build_job_dispatcher/Dockerfile
    container_name: openci-build-job-dispatcher
    image: openci-build-job-dispatcher
    restart: unless-stopped
    environment:
      OPENCI_SERVER_URL: http://server:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY environment variable is required}
      SENTRY_DSN: ${SENTRY_DSN_BUILD_JOB_DISPATCHER:-}
      HOST_HOME: ${HOME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./.env:/app/.env:ro
    depends_on:
      server:
        condition: service_healthy

  build-job-executor:
    build:
      context: .
      dockerfile: apps/build_job_executor/Dockerfile
    image: openci-build-job-executor
    profiles:
      - donotstart
    environment:
      OPENCI_SERVER_URL: http://server:8080
      BASE_VM_NAME: ${BASE_VM_NAME:-base-macos}

      LOKI_URL: http://loki:3100

      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY environment variable is required}

      ORCHARD_API_URL: ${ORCHARD_API_URL:-https://orchard-controller:6120}

      SENTRY_DSN: ${SENTRY_DSN_BUILD_JOB_EXECUTOR:-}
    volumes:
      - ${HOST_HOME:-~}/.orchard:/home/appuser/.orchard:ro
    depends_on:
      - server
      - orchard-controller

  orchard-controller:
    image: ghcr.io/cirruslabs/orchard:latest
    container_name: openci-orchard-controller
    restart: unless-stopped
    command: ["controller", "run"]
    expose:
      - "6120"
    ports:
      - "6120:6120"
    volumes:
      - orchard_data:/root/.orchard

  loki:
    image: grafana/loki:latest
    container_name: openci-loki
    restart: unless-stopped
    expose:
      - "3100"
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/tmp/loki

volumes:
  postgres_data:
  orchard_data:
  loki_data:
