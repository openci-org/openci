services:
  db:
    image: postgres:16-alpine
    container_name: openci-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: apps/openci_server/Dockerfile
    container_name: openci-server
    restart: unless-stopped
    environment:
      HOST: any
      PORT: 8080
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL environment variable is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY environment variable is required}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY environment variable is required}

      S3_ENDPOINT: http://seaweedfs:8000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY environment variable is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY environment variable is required}

      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/firebase-service-account.json
      
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:?GITHUB_API_BASE_URL environment variable is required}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?GITHUB_APP_ID environment variable is required}
      GITHUB_PRIVATE_KEY_PATH: /app/credentials/github-private-key.pem
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET environment variable is required}

      LOKI_URL: ${LOKI_URL:-http://loki:3100}

      ORCHARD_API_URL: ${ORCHARD_API_URL:?ORCHARD_API_URL environment variable is required}
      ORCHARD_SERVICE_ACCOUNT_NAME: ${ORCHARD_SERVICE_ACCOUNT_NAME:?ORCHARD_SERVICE_ACCOUNT_NAME environment variable is required}
      ORCHARD_SERVICE_ACCOUNT_TOKEN: ${ORCHARD_SERVICE_ACCOUNT_TOKEN:?ORCHARD_SERVICE_ACCOUNT_TOKEN environment variable is required}

      SENTRY_DSN: ${SENTRY_DSN}
    volumes:
      - ./firebase-service-account.json:/app/credentials/firebase-service-account.json:ro
      - ./github-private-key.pem:/app/credentials/github-private-key.pem:ro
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    depends_on:
      - db
      - seaweedfs


  seaweedfs:
    image: chrislusf/seaweedfs:3.59
    container_name: openci-seaweedfs
    restart: unless-stopped
    expose:
      - "8333" # Filer port
      - "9333" # Master port
      - "8000" # S3 API port
    volumes:
      - seaweedfs_data:/data
    command: 'server -dir=/data -s3 -s3.port=8000 -ip=seaweedfs'

  job-processor:
    build:
      context: .
      dockerfile: apps/openci_build_job_processor/Dockerfile
    container_name: openci-job-processor
    restart: unless-stopped
    environment:
      OPENCI_SERVER_URL: http://server:8080
      OPENCI_RUNS_ON_PATTERN: macos-latest
      OPENCI_MAX_CONCURRENT_JOBS: ${OPENCI_MAX_CONCURRENT_JOBS:-3}

      ORCHARD_API_URL: https://orchard-controller:6120
      ORCHARD_SERVICE_ACCOUNT_NAME: ${ORCHARD_SERVICE_ACCOUNT_NAME:-bootstrap-admin}
      ORCHARD_SERVICE_ACCOUNT_TOKEN: ${ORCHARD_SERVICE_ACCOUNT_TOKEN}
      BASE_VM_NAME: ${BASE_VM_NAME:-tahoe-base}

      LOKI_URL: http://loki:3100

      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY environment variable is required}

      SENTRY_DSN: ${SENTRY_DSN_JOB_PROCESSOR:-}
    volumes:
      - ~/.orchard:/home/appuser/.orchard:ro
    depends_on:
      - server
      - orchard-controller

  orchard-controller:
    image: ghcr.io/cirruslabs/orchard:latest
    container_name: openci-orchard-controller
    restart: unless-stopped
    command: ["controller", "run"]
    expose:
      - "6120"
    ports:
      - "6120:6120"
    volumes:
      - orchard_data:/root/.orchard

  loki:
    image: grafana/loki:latest
    container_name: openci-loki
    restart: unless-stopped
    expose:
      - "3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/tmp/loki

volumes:
  postgres_data:
  seaweedfs_data:
  orchard_data:
  loki_data:
