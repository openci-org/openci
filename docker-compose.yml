services:
  db:
    image: postgres:16-alpine
    container_name: openci-db
    environment:
      POSTGRES_DB: openci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: apps/openci_server/Dockerfile
    container_name: openci-server
    environment:
      - HOST=any
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-openci}
    expose:
      - "8080"
    depends_on:
      - db

  caddy:
    image: caddy:2-alpine
    container_name: openci-caddy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
