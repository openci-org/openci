services:
  db:
    image: postgres:16-alpine
    container_name: openci-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: apps/openci_server/Dockerfile
    container_name: openci-server
    restart: unless-stopped
    environment:
      - HOST=any
      - PORT=8080
      - APP_ENV=${APP_ENV:-development}

      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL environment variable is required}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY environment variable is required}

      - S3_ENDPOINT=http://seaweedfs:8000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:?S3_ACCESS_KEY environment variable is required}
      - S3_SECRET_KEY=${S3_SECRET_KEY:?S3_SECRET_KEY environment variable is required}

      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/firebase-service-account.json

      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:?GITHUB_WEBHOOK_SECRET environment variable is required}
      - GITHUB_APP_ID=${GITHUB_APP_ID:?GITHUB_APP_ID environment variable is required}
      - GITHUB_PRIVATE_KEY_PATH=/app/credentials/github-private-key.pem
      - GITHUB_API_BASE_URL=${GITHUB_API_BASE_URL:?GITHUB_API_BASE_URL environment variable is required}

      - ALLOWED_WORKER_UIDS=${ALLOWED_WORKER_UIDS}
      - SENTRY_DSN=${SENTRY_DSN}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY environment variable is required}
    volumes:
      - ./firebase-service-account.json:/app/credentials/firebase-service-account.json:ro
      - ./github-private-key.pem:/app/credentials/github-private-key.pem:ro
    expose:
      - "8080"
    depends_on:
      - db
      - seaweedfs

  tailscale:
    image: tailscale/tailscale:latest
    container_name: openci-tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale_data:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY:?TAILSCALE_AUTHKEY environment variable is required}
      - TS_STATE_DIR=/var/lib/tailscale
    restart: unless-stopped

  job-processor:
    build:
      context: .
      dockerfile: apps/openci_build_job_processor/Dockerfile
    container_name: openci-job-processor
    network_mode: "service:tailscale"
    restart: unless-stopped
    environment:
      - OPENCI_SERVER_URL=http://server:8080
      - OPENCI_RUNS_ON_PATTERN=${OPENCI_RUNS_ON_PATTERN:?OPENCI_RUNS_ON_PATTERN environment variable is required}
      - LUME_BASE_VM_NAME=${LUME_BASE_VM_NAME:?LUME_BASE_VM_NAME environment variable is required}
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY:?TAILSCALE_API_KEY environment variable is required}
      - TAILSCALE_TAILNET=${TAILSCALE_TAILNET:?TAILSCALE_TAILNET environment variable is required}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?INTERNAL_API_KEY environment variable is required}
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      - tailscale
      - server

  caddy:
    image: caddy:2-alpine
    container_name: openci-caddy
    restart: unless-stopped
    environment:
      - OPENCI_DOMAIN=${OPENCI_DOMAIN:?OPENCI_DOMAIN environment variable is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  seaweedfs:
    image: chrislusf/seaweedfs:3.59
    container_name: openci-seaweedfs
    restart: unless-stopped
    ports:
      - "127.0.0.1:18333:8333" # Filer port
      - "127.0.0.1:19333:9333" # Master port
      - "127.0.0.1:18000:8000" # S3 API port
    volumes:
      - seaweedfs_data:/data
    command: 'server -dir=/data -s3 -s3.port=8000 -ip=seaweedfs'

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  seaweedfs_data:
  tailscale_data:
