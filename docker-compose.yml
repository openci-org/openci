services:
  db:
    image: postgres:16-alpine
    container_name: openci-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: apps/openci_server/Dockerfile
    container_name: openci-server
    restart: unless-stopped
    environment:
      - HOST=any
      - PORT=8080
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-openci}?sslmode=disable}
      - S3_ENDPOINT=http://seaweedfs:8000

      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-dummy_access_key}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-dummy_secret_key}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/firebase-service-account.json
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_PRIVATE_KEY_PATH=/app/credentials/github-private-key.pem
      - GITHUB_API_BASE_URL=${GITHUB_API_BASE_URL}
      - ALLOWED_WORKER_UIDS=${ALLOWED_WORKER_UIDS}
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - ./firebase-service-account.json:/app/credentials/firebase-service-account.json:ro
      - ./github-private-key.pem:/app/credentials/github-private-key.pem:ro
    expose:
      - "8080"
    depends_on:
      - db
      - seaweedfs

  caddy:
    image: caddy:2-alpine
    container_name: openci-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  seaweedfs:
    image: chrislusf/seaweedfs:3.59
    container_name: openci-seaweedfs
    restart: unless-stopped
    ports:
      - "18333:8333" # Filer port
      - "19333:9333" # Master port
      - "18000:8000" # S3 API port
    volumes:
      - seaweedfs_data:/data
    command: 'server -dir=/data -s3 -s3.port=8000 -ip=seaweedfs'

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  seaweedfs_data:
