name: app_minimizer_plus
description: "A Flutter plugin to minimize the iOS application using Pigeon."
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.11.5 <4.0.0"
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^26.0.1
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AppMinimizerPlusPlugin
