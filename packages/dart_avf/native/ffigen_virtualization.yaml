name: VirtualizationBindings
description: Dart bindings for Apple Virtualization.framework
language: objc
output: 'virtualization_bindings.dart'
headers:
  entry-points:
    - '/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/Virtualization.framework/Headers/Virtualization.h'
  include-directives:
    - '/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks/Virtualization.framework/Headers/*.h'

compiler-opts:
  - '-F/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/System/Library/Frameworks'
  - '-isysroot/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk'
  - '-mmacosx-version-min=13.0'

preamble: |
  // Auto-generated bindings for Apple Virtualization.framework
  // ignore_for_file: always_specify_types, camel_case_types
  // ignore_for_file: non_constant_identifier_names, unused_element, unused_field

objc-interfaces:
  include:
    - VZVirtualMachine
    - VZVirtualMachineConfiguration
    - VZLinuxBootLoader
    - VZEFIBootLoader
    - VZEFIVariableStore
    - VZMacOSBootLoader
    - VZMacPlatformConfiguration
    - VZMacHardwareModel
    - VZMacMachineIdentifier
    - VZMacAuxiliaryStorage
    - VZMacOSRestoreImage
    - VZMacOSConfigurationRequirements
    - VZMacOSInstaller
    - VZGenericPlatformConfiguration
    - VZGenericMachineIdentifier
    - VZDiskImageStorageDeviceAttachment
    - VZVirtioBlockDeviceConfiguration
    - VZVirtioNetworkDeviceConfiguration
    - VZNATNetworkDeviceAttachment
    - VZVirtioEntropyDeviceConfiguration
    - VZVirtioTraditionalMemoryBalloonDeviceConfiguration
    - VZVirtioConsoleDeviceSerialPortConfiguration
    - VZFileHandleSerialPortAttachment
    - VZVirtioSocketDeviceConfiguration
    - VZMacGraphicsDeviceConfiguration
    - VZMacGraphicsDisplayConfiguration
    - VZUSBKeyboardConfiguration
    - VZMacKeyboardConfiguration
    - VZUSBScreenCoordinatePointingDeviceConfiguration
    - VZMacTrackpadConfiguration
    - VZSharedDirectory
    - VZSingleDirectoryShare
    - VZMultipleDirectoryShare
    - VZVirtioFileSystemDeviceConfiguration
    - VZMacOSVirtualMachineStartOptions
