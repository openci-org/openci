name: openci_virtual_ble
description: Connect a Flutter app on an iOS Simulator to a virtual Bluetooth GATT peer for two-device integration tests.
version: 0.1.0
repository: https://github.com/openci-org/openci/tree/develop/packages/openci_virtual_ble
issue_tracker: https://github.com/openci-org/openci/issues
environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: OpenciVirtualBlePlugin
