name: macos_updater
description: "A macOS-only Flutter plugin for Sparkle-based app updates."
version: 0.0.1
homepage: https://github.com/openci-org/openci

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  meta: ^1.17.0

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: 3.2.6-dev.1
  pigeon: ^26.0.1

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: MacosUpdaterPlugin
