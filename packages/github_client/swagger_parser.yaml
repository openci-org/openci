swagger_parser:
  schema_url: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json
  output_directory: lib/api
  name: github
  language: dart
  json_serializer: freezed
  root_client: true
  root_client_name: GitHubClient
  export_file: true
  put_in_folder: true
  mark_files_as_generated: true
  unknown_enum_value: true
  use_freezed3: true
  include_paths:
    # Installation token
    - "/app/installations/{installation_id}/access_tokens"
    # Check runs
    - "/repos/{owner}/{repo}/check-runs"
    - "/repos/{owner}/{repo}/check-runs/{check_run_id}"
    # Commits (for resolving tag SHA)
    - "/repos/{owner}/{repo}/commits/{ref}"
    # Repos (verify access)
    - "/repos/{owner}/{repo}"
