name: openci_server Docker CI

on:
  push:
    branches:
      - develop

    paths:
      - "apps/openci_server/**"
      - "packages/openci_shared/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".github/workflows/openci-server-docker-ci.yml"

  pull_request:
    branches:
      - develop

    paths:
      - "apps/openci_server/**"
      - "packages/openci_shared/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".github/workflows/openci-server-docker-ci.yml"

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dummy Firebase Service Account for CI
        run: |
          echo '{
            "type": "service_account",
            "project_id": "openci-dummy",
            "private_key_id": "dummy-key-id",
            "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvAIBADANBgkqhkiG9w0BAQEFAASCBKYwggSiAgEAAoIBAQC3......\n-----END PRIVATE KEY-----\n",
            "client_email": "dummy@openci-dummy.iam.gserviceaccount.com"
          }' > firebase-service-account.json

      - name: Start services with Docker Compose
        run: docker compose up --build -d

      - name: Wait for server to start
        run: sleep 3

      - name: Verify connection and response
        run: |
          for i in {1..30}; do
            RESPONSE=$(curl -s http://localhost/ || true)
            echo "Attempt $i: Server Response: $RESPONSE"
            if [[ "$RESPONSE" == *"OpenCI Server (Shelf) is running!"* ]]; then
              echo "Verification successful!"
              exit 0
            fi
            sleep 1
          done
          echo "Verification failed! Timeout waiting for server."
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Shut down services
        if: always()
        run: docker compose down -v
