name: Dart apps CI

on:
  push:
    paths:
      - "apps/genuineci_cli/**"
      - "apps/build_job_planner/**"
      - "apps/build_job_worker/**"
      - "apps/genuineci_server/**"
      - "packages/openci_shared/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "codecov.yml"
      - ".github/workflows/dart-apps-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: genuineci_cli
            path: apps/genuineci_cli
            format_paths: apps/genuineci_cli
          - app: build_job_planner
            path: apps/build_job_planner
            format_paths: apps/build_job_planner
          - app: build_job_worker
            path: apps/build_job_worker
            format_paths: apps/build_job_worker
          - app: genuineci_server
            path: apps/genuineci_server
            format_paths: >-
              apps/genuineci_server/lib
              apps/genuineci_server/routes
              apps/genuineci_server/test
          - app: openci_shared
            path: packages/openci_shared
            format_paths: packages/openci_shared

    services:
      postgres:
        image: ${{ matrix.app == 'genuineci_server' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_DB: openci_test
          POSTGRES_USER: openci_test
          POSTGRES_PASSWORD: openci_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U openci_test -d openci_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.8"
          cache: true

      - name: Install dependencies (Workspace root)
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          ${{ matrix.format_paths }}

      - name: Analyze code
        run: flutter analyze --no-pub ${{ matrix.path }}

      - name: Run unit tests with coverage
        if: matrix.app != 'genuineci_server'
        working-directory: ${{ matrix.path }}
        run: flutter test --coverage --no-pub

      - name: Run server tests with lib and routes coverage
        if: matrix.app == 'genuineci_server'
        working-directory: ${{ matrix.path }}
        env:
          TEST_DATABASE_URL: postgres://openci_test:openci_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/openci_test?sslmode=disable
        run: |
          dart test test --coverage=coverage/raw
          dart run coverage:format_coverage --lcov --in=coverage/raw --out=coverage/lcov.info --report-on=lib --report-on=routes --base-directory=.

      - name: Normalize coverage paths
        run: >-
          sed --in-place
          's|^SF:|SF:${{ matrix.path }}/|'
          ${{ matrix.path }}/coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ${{ matrix.path }}/coverage/lcov.info
          flags: ${{ matrix.app }}
          name: ${{ matrix.app }}
          token: ${{ secrets.CODECOV_TOKEN }}
