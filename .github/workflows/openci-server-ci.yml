name: openci_server CI

on:
  push:
    branches:
      - develop
    paths:
      - "apps/openci_server/**"
      - "packages/openci_shared/**"
      - ".github/workflows/openci-server-ci.yml"

  pull_request:
    branches:
      - develop
    paths:
      - "apps/openci_server/**"
      - "packages/openci_shared/**"
      - ".github/workflows/openci-server-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          dart-version: "3.11.5"

      - name: Install dependencies (Workspace root)
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed apps/openci_server

      - name: Analyze code
        run: flutter analyze --no-pub apps/openci_server

      - name: Run tests
        working-directory: apps/openci_server
        run: flutter test
