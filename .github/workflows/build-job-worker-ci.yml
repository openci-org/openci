name: Build Job Worker CI

on:
  push:
    paths:
      - "apps/build_job_worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.mts"
      - "docker-compose.temporal.yml"
      - ".github/workflows/build-job-worker-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build_job_worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/build_job_worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js and Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          working-directory: "."
          run-install: false
          cache: true

      - name: Install dependencies
        working-directory: .
        run: vp i --frozen-lockfile --filter build-job-worker

      - name: Verify formatting
        run: vp fmt --check

      - name: Analyze code
        run: vp check

      - name: Typecheck
        run: vp run typecheck

      - name: Run Activity and Workflow tests
        run: vp test

      - name: Build worker
        run: vp run build

      - name: Validate Docker Compose configuration
        working-directory: .
        run: docker compose -f docker-compose.temporal.yml config --quiet

      - name: Build Docker image
        working-directory: .
        run: docker build --file apps/build_job_worker/Dockerfile .
