name: openci
publish_to: none

environment:
  sdk: ^3.11.5

workspace:
  - apps/dashboard
  - apps/github_webhook_processor
  - apps/build_job_dispatcher
  - apps/build_job_executor
  - apps/genuineci_cli
  - apps/openci_server
  - genuine_ci
  - packages/genuine_ci
  - packages/macos_updater
  - packages/openci_shared
  - packages/pubspec_version_hook

dependency_overrides:
  analyzer: 10.0.1
  dart_style: 3.1.7
