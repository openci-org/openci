coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "**/*.g.dart"
  - "**/*.freezed.dart"

flags:
  openci_cli:
    paths:
      - apps/openci_cli/lib/
  openci_workflow:
    paths:
      - packages/openci_workflow/lib/
  openci_dart_functions:
    paths:
      - firebase/dart_functions/lib/
  openci_shared:
    paths:
      - packages/openci_shared/lib/
