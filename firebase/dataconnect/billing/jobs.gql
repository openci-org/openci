# Candidate discovery only. Functions authorize workers, select an entitled
# period, and serialize worker-capacity decisions before CreateBillingAdmission.
# Keyset pagination lets the scheduler skip blocked teams without OFFSET drift.
query GetQueuedBillingJobs(
  $afterCreatedAt: Int64! = 0
  $afterId: String! = ""
  $excludedTeamIds: [String!]! = []
  $limit: Int! = 100
) @auth(level: NO_ACCESS) {
  jobs: buildJobs(
    where: {
      _and: [
        { status: { eq: "QUEUED" }, teamId: { isNull: false, nin: $excludedTeamIds } }
        {
          _or: [
            { createdAt: { gt: $afterCreatedAt } }
            { createdAt: { eq: $afterCreatedAt }, id: { gt: $afterId } }
          ]
        }
      ]
    }
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: $limit
  )
    @check(expr: "vars.limit > 0 && vars.limit <= 100", message: "Limit must be between 1 and 100")
    @check(expr: "int(vars.afterCreatedAt) >= 0", message: "Cursor time must not be negative") {
    id
    teamId
    createdAt
  }
}

# A read is not a capacity reservation. The orchestration layer must prevent
# concurrent dispatches from exceeding the configured per-worker capacity.
query GetBillingWorkerJobs($workerHost: String!) @auth(level: NO_ACCESS) {
  jobs: buildJobs(
    where: { workerHost: { eq: $workerHost }, status: { eq: "IN_PROGRESS" } }
    orderBy: { id: ASC }
    limit: null
  ) {
    id
    teamId
    latestRunId
  }
}

# Derive team/run ownership from the job, never from unverified worker input.
query GetBillingJob($id: String!) @auth(level: NO_ACCESS) {
  job: buildJob(id: $id) {
    id
    teamId
    status
    workerHost
    latestRunId
  }
}
