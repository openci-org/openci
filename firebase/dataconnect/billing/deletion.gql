# Functions reads GetBillingContext BEFORE verifying Stripe has no live
# subscription. Close any verified ended Checkout first, then pass the observed
# Customer intent/ID and state revision. A conflict requires fresh verification.
mutation DeleteBillingTeam(
  $teamId: String!
  $userId: String!
  $livemode: Boolean!
  $expectedCustomerCreationKey: String = null
  $expectedStripeCustomerId: String = null
  $expectedStripeRevision: Int64 = null
) @auth(level: NO_ACCESS) @transaction {
  team_update(key: { id: $teamId }, data: { updatedAt_expr: "int(request.time)" })
    @redact
    @check(expr: "this != null", message: "Team not found")
  billingAccount_upsert(data: { teamId_expr: "response.team_update.id" })
  query @redact {
    teamMember(
      first: {
        where: {
          teamId: { eq_expr: "response.billingAccount_upsert.teamId" }
          userId: { eq: $userId }
        }
      }
    ) @check(expr: "this != null", message: "Team access denied") {
      id
    }
    customer: billingCustomerCreation(
      key: { teamId_expr: "response.billingAccount_upsert.teamId" }
    )
      @check(
        expr: """
        this == null
          ? vars.expectedCustomerCreationKey == null && vars.expectedStripeCustomerId == null
          : this.idempotencyKey == vars.expectedCustomerCreationKey &&
            this.stripeCustomerId != null && this.stripeCustomerId == vars.expectedStripeCustomerId &&
            this.livemode == vars.livemode
        """
        message: "Customer creation is pending or changed; verify Stripe again"
      ) {
      idempotencyKey
      stripeCustomerId
      livemode
    }
    stripe: billingStripeState(key: { teamId_expr: "response.billingAccount_upsert.teamId" })
      @check(
        expr: """
        this == null ? vars.expectedStripeRevision == null :
          this.revision == vars.expectedStripeRevision &&
          this.stripeCustomerId == vars.expectedStripeCustomerId && this.livemode == vars.livemode &&
          this.subscriptionStatus in ['none', 'canceled', 'incomplete_expired']
        """
        message: "Subscription is active, unverified, or changed; verify Stripe again"
      ) {
      revision
      stripeCustomerId
      livemode
      subscriptionStatus
    }
    checkouts: billingCheckoutCreations(
      where: {
        teamId: { eq_expr: "response.billingAccount_upsert.teamId" }
        closedAt: { isNull: true }
      }
      limit: 1
    )
      @check(
        expr: "size(this) == 0"
        message: "Resolve the open Checkout before deleting the team"
      ) {
      idempotencyKey
    }
  }
  # Return credential references before the Team FK cascades remove them.
  # Functions must persist/retry Secret Manager cleanup, including lost responses.
  cleanup: query {
    secrets: secretReferences(
      where: { teamId: { eq_expr: "response.billingAccount_upsert.teamId" } }
      limit: null
    ) {
      secretVersionPath
    }
    requests: gitHubConnectionRequests(
      where: { teamId: { eq_expr: "response.billingAccount_upsert.teamId" } }
      limit: null
    ) {
      codeVerifierSecretVersionPath
    }
    sessions: gitHubConnectionSessions(
      where: {
        teamId: { eq_expr: "response.billingAccount_upsert.teamId" }
        accessTokenSecretVersionPath: { isNull: false }
      }
      limit: null
    ) {
      accessTokenSecretVersionPath
    }
  }
  # Persist cleanup in this transaction; returning paths alone loses them if
  # the response never reaches Functions. Keep versions for in-flight builds.
  receipt: billingTeamDeletion_insert(
    data: {
      teamId_expr: "response.billingAccount_upsert.teamId"
      userId: $userId
      secretPaths_expr: "response.cleanup.secrets.map(s, s.secretVersionPath)"
      githubPaths_expr: "response.cleanup.requests.map(r, r.codeVerifierSecretVersionPath) + response.cleanup.sessions.map(s, s.accessTokenSecretVersionPath)"
      createdAt_expr: "request.time"
      cleanupAfter_expr: "request.time + duration('86400s')"
    }
  )
  # Billing accounts/periods/trial claims/purchases and build history survive.
  team_delete(id_expr: "response.receipt.teamId")
    @check(expr: "this != null", message: "Team not found")
}

query GetBillingTeamDeletion($teamId: String!, $userId: String!) @auth(level: NO_ACCESS) {
  receipt: billingTeamDeletion(
    first: { where: { teamId: { eq: $teamId }, userId: { eq: $userId } } }
  ) {
    teamId
  }
}

query GetDueBillingTeamDeletions @auth(level: NO_ACCESS) {
  deletions: billingTeamDeletions(
    where: { cleanedAt: { isNull: true }, cleanupAfter: { le_expr: "request.time" } }
    orderBy: [{ cleanupAfter: ASC }, { teamId: ASC }]
    limit: 10
  ) {
    teamId
    secretPaths
    githubPaths
  }
}

mutation CompleteBillingTeamCleanup($teamId: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    receipt: billingTeamDeletion(key: { teamId: $teamId })
      @check(
        expr: "this != null && size(dyn(this.secretPaths)) == 0 && size(dyn(this.githubPaths)) == 0"
        message: "Credential cleanup is incomplete"
      ) {
      teamId
      secretPaths
      githubPaths
    }
  }
  billingTeamDeletion_update(
    key: { teamId_expr: "response.query.receipt.teamId" }
    data: { secretPaths_expr: "[]", githubPaths_expr: "[]", cleanedAt_expr: "request.time" }
  )
}

# Acknowledge each remote destruction so a large team makes progress even if
# Functions times out halfway through its credential list.
mutation AcknowledgeBillingCredentialCleanup($teamId: String!, $path: String!, $kind: String!)
@auth(level: NO_ACCESS)
@transaction {
  locked: billingTeamDeletion_update(
    key: { teamId: $teamId }
    data: { cleanupAfter_expr: "request.time" }
  )
    @check(
      expr: "this != null && vars.kind in ['secret', 'github']"
      message: "Invalid cleanup receipt"
    )
  query @redact {
    receipt: billingTeamDeletion(key: { teamId_expr: "response.locked.teamId" }) {
      secretPaths
      githubPaths
    }
  }
  billingTeamDeletion_update(
    key: { teamId_expr: "response.locked.teamId" }
    data: {
      secretPaths_expr: "vars.kind == 'secret' ? dyn(response.query.receipt.secretPaths).filter(p, p != vars.path) : response.query.receipt.secretPaths"
      githubPaths_expr: "vars.kind == 'github' ? dyn(response.query.receipt.githubPaths).filter(p, p != vars.path) : response.query.receipt.githubPaths"
    }
  )
}

mutation DeferBillingTeamCleanup($teamId: String!) @auth(level: NO_ACCESS) {
  billingTeamDeletion_update(
    key: { teamId: $teamId }
    data: { cleanupAfter_expr: "request.time + duration('3600s')" }
  )
}
