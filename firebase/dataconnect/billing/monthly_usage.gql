# Read-only preview. The month is a date in the requested Japan calendar month.
# Pass yen per US dollar only when a USD equivalent is needed.
query GetTeamMonthlyUsage(
  $teamId: String!
  $month: Date!
  $jpyPerUsd: String = null
  $afterRunId: String = null
) @auth(level: NO_ACCESS) {
  statement: _selectFirst(
    sql: """
    WITH calendar AS (
      SELECT date_trunc('month', $2::date::timestamp) AS local_start
    ), bounds AS (
      SELECT (extract(epoch FROM local_start AT TIME ZONE 'Asia/Tokyo') * 1000)::bigint AS start_ms,
             (extract(epoch FROM (local_start + interval '1 month') AT TIME ZONE 'Asia/Tokyo') * 1000)::bigint AS end_ms
      FROM calendar
    ), runs AS (
      SELECT e.run_id, e.job_id, prep.updated_at AS vm_ready_at, e.observed_at_ms,
             e.outcome, e.measurement_incomplete,
             CASE WHEN prep.run_id IS NULL THEN 0 ELSE greatest(0,
               least(e.observed_at_ms, b.end_ms) -
               greatest(b.start_ms, e.started_at_ms, ceil(extract(epoch FROM prep.updated_at) * 1000)::bigint)
             ) END AS measured_ms
      FROM billing_executions e
      JOIN billing_periods p ON p.id = e.period_id AND p.team_id = e.team_id
      LEFT JOIN build_steps prep ON prep.run_id = e.run_id
        AND prep.step_id = 'prepare_vm' AND prep.status = 'SUCCESS'
      CROSS JOIN bounds b
      WHERE e.team_id = $1 AND e.started_at_ms < b.end_ms AND e.observed_at_ms > b.start_ms
        AND p.period_type <> 'trial' AND NOT starts_with(e.period_id, 'complimentary-pro:')
    ), totals AS (
      SELECT count(*) AS run_count, coalesce(sum(measured_ms), 0) AS measured_ms FROM runs
    ), priced AS (
      SELECT *, ceil(measured_ms / 60000) AS minutes FROM totals
    )
    SELECT $1::text AS "teamId", to_char($2::date, 'YYYY-MM') AS month,
           run_count::text AS "runCount", measured_ms::text AS "measuredMillis",
           minutes::text AS "billableMinutes", minutes::text AS "amountJpyTaxIncluded",
           $3::text AS "jpyPerUsd",
           round(minutes * 100 / nullif($3::numeric, 0))::text AS "amountUsdCentsTaxIncluded",
           coalesce((
             SELECT jsonb_agg(jsonb_build_object(
               'runId', run_id, 'jobId', job_id, 'vmReadyAt', vm_ready_at,
               'observedAtMs', observed_at_ms::text, 'measuredMillis', measured_ms::text,
               'outcome', outcome, 'measurementIncomplete', measurement_incomplete
             ) ORDER BY run_id)
             FROM (SELECT * FROM runs WHERE $4::text IS NULL OR run_id > $4::text
                   ORDER BY run_id LIMIT 100) page
           ), '[]'::jsonb) AS runs
    FROM priced
    """
    params: [$teamId, $month, $jpyPerUsd, $afterRunId]
  )
    @check(
      expr: "vars.jpyPerUsd == null || (vars.jpyPerUsd.matches('^[0-9]{1,12}([.][0-9]{1,12})?$') && double(vars.jpyPerUsd) > 0)"
      message: "JPY per USD must be a positive decimal rate"
    )
}
