fragment GitHubConnectionMetadata on GitHubConnection {
  id
  teamId
  githubApiBaseUrl
  githubAppId
  installationId
  accountId
  accountType
  accountLogin
  status
  verifiedAt
}

# Functions supplies the operator-configured host/app, then verifies live GitHub
# permissions before minting a token or serving repository data.
query GetActiveGitHubConnection(
  $githubApiBaseUrl: String!
  $githubAppId: Int64!
  $installationId: Int64!
) @auth(level: NO_ACCESS) {
  connection: gitHubConnection(
    first: {
      where: {
        githubApiBaseUrl: { eq: $githubApiBaseUrl }
        githubAppId: { eq: $githubAppId }
        installationId: { eq: $installationId }
        status: { eq: "active" }
      }
    }
  ) {
    ...GitHubConnectionMetadata
  }
}
