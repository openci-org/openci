# Completing the task and publishing all jobs is atomic. The SDK generator does
# not support BuildJob_Data inputs, so only the bulk insert uses PostgreSQL's
# jsonb_to_recordset. All SQL parameters are bound, never interpolated.
mutation CompleteWebhookTask(
  $id: String!
  $jobsJson: String!
  $jobCount: Int!
  $skippedJson: String! = "[]"
  $skippedCount: Int! = 0
  $pathFilterReason: String = null
  $comparisonBaseSha: String = null
  $connectionId: String = null
  $owner: String = null
  $repo: String = null
  $commitSha: String = null
  $branch: String = null
  $commitMessage: String = null
  $pullRequestNumber: Int64 = null
  $githubBaseUrl: String = null
  $planningId: String = null
  $planningToken: String = null
  $cancelClosedPullRequest: Boolean! = false
) @auth(level: NO_ACCESS) @transaction {
  webhookTask_updateMany(
    where: { id: { eq: $id }, status: { eq: "pending" } }
    data: {
      status: "completed"
      errorMessage: null
      pathFilterReason: $pathFilterReason
      updatedAt_expr: "int(request.time)"
    }
  )
    @check(expr: "this == 1", message: "Webhook task is not pending")
    @check(
      expr: "vars.jobCount >= 0 && vars.skippedCount >= 0 && vars.jobCount + vars.skippedCount <= 100"
      message: "Invalid workflow count"
    )
    @check(
      expr: "vars.skippedCount == 0 || (vars.comparisonBaseSha != null && vars.pathFilterReason == null)"
      message: "Skipped workflows require a complete comparison"
    )
    @check(
      expr: "!vars.cancelClosedPullRequest || (vars.jobCount == 0 && vars.skippedCount == 0 && vars.pullRequestNumber != null && vars.planningId != null && vars.planningToken != null)"
      message: "PR closure requires a fenced empty plan"
    )
  # A conditional write locks the fence until jobs and cancellations commit.
  # A read-only check would allow a new planner to overtake this transaction.
  pullRequestPlanning_updateMany(
    where: {
      id: { eq: $planningId }
      token: { eq: $planningToken }
      connectionId: { eq: $connectionId }
      pullRequestNumber: { eq: $pullRequestNumber }
    }
    data: { token: $planningToken }
  )
    @redact
    @check(
      expr: "(vars.planningId == null && vars.planningToken == null) || this == 1"
      message: "PR planning observation was superseded"
    )
  query @redact {
    connection: gitHubConnection(first: { where: { id: { eq: $connectionId } } })
      @check(
        expr: "(vars.jobCount + vars.skippedCount == 0 && !vars.cancelClosedPullRequest) || (this != null && this.status == 'active')"
        message: "GitHub connection is no longer active"
      ) {
      teamId
      installationId
      status
    }
  }
  # Returning to a superseded revision (including reopen after PR closure) needs
  # fresh validation. Keep historical rows and release only automatic cancels;
  # a user cancellation is not an implicit request to run again.
  releasedExecutionKeys: _execute(
    sql: """
    UPDATE build_jobs SET webhook_execution_key = NULL
    WHERE webhook_execution_key IN (
      SELECT w."webhookExecutionKey"
      FROM jsonb_to_recordset($1::jsonb) AS w("webhookExecutionKey" text)
    ) AND status = 'CANCELLED' AND superseded_by_task_id IS NOT NULL
    """
    params: [$jobsJson]
  ) @redact
  jobs: _executeReturning(
    sql: """
    INSERT INTO build_jobs (
      id, status, owner, repo, workflow_name, workflow_file_name, team_id,
      commit_sha, branch, commit_message, pull_request_number, github_base_url,
      installation_id, runs_on, run_count, created_at, updated_at, flutter_version,
      cancel_previous_runs, webhook_execution_key
    )
    SELECT w.id, 'QUEUED', $2, $3, w.name, w.file, $4,
      $5, $6, $7, $8::bigint, $9, $10, 'macos-latest', 0, $11::bigint, $11::bigint,
      w."flutterVersion", COALESCE(w."cancelPreviousRuns", false), w."webhookExecutionKey"
    FROM jsonb_to_recordset($1::jsonb) AS w(
      id text, name text, file text, "flutterVersion" text, "cancelPreviousRuns" boolean,
      "webhookExecutionKey" text
    )
    WHERE length(trim(w.id)) > 0 AND length(trim(w.name)) > 0
      AND length(w.file) > 0 AND length($2::text) > 0 AND length($3::text) > 0
      AND length($5::text) > 0 AND length($6::text) > 0
      AND (NOT COALESCE(w."cancelPreviousRuns", false) OR
        ($8::bigint IS NOT NULL AND $12::text IS NOT NULL AND $13::text IS NOT NULL))
      AND (w."webhookExecutionKey" IS NULL OR
        (w."webhookExecutionKey" ~ '^[0-9a-f]{64}$' AND $8::bigint IS NOT NULL
          AND $12::text IS NOT NULL AND $13::text IS NOT NULL))
    -- Preserve the existing job, including its terminal result, run and Check.
    -- Return its ID so notification retries synchronize the same execution.
    ON CONFLICT (webhook_execution_key) DO UPDATE
      SET webhook_execution_key = EXCLUDED.webhook_execution_key
    RETURNING id
    """
    params: [
      $jobsJson
      $owner
      $repo
      { _expr: "response.query.connection == null ? '' : response.query.connection.teamId" }
      $commitSha
      $branch
      $commitMessage
      $pullRequestNumber
      $githubBaseUrl
      {
        _expr: "response.query.connection == null ? '' : string(response.query.connection.installationId)"
      }
      { _expr: "int(request.time)" }
      $planningId
      $planningToken
    ]
  ) @check(expr: "size(this) == vars.jobCount", message: "Invalid build job batch")
  # Closure cancels every active workflow in the verified PR scope. Superseding
  # commits still require both jobs to opt in and have different SHAs.
  # Use the returned job IDs for both steps: a duplicate plan reuses an existing ID.
  # Lock dispatches before jobs, matching executor admission/result lock order.
  # A terminal result that won the race keeps its billing and Check conclusion.
  cancellationLocks: _execute(
    sql: """
    UPDATE build_job_dispatches AS dispatch SET updated_at = dispatch.updated_at
    FROM build_jobs AS old
    WHERE old.status IN ('QUEUED', 'IN_PROGRESS')
      AND (
        ($2::boolean AND old.team_id = $3 AND old.installation_id = $4
          AND old.github_base_url = $5
          AND lower(old.owner) = lower($6::text) AND lower(old.repo) = lower($7::text)
          AND old.pull_request_number = $8::bigint)
        OR EXISTS (
          SELECT 1 FROM build_jobs AS newest
          WHERE newest.id IN (SELECT w.id FROM jsonb_to_recordset($1::jsonb) AS w(id text))
            AND newest.cancel_previous_runs AND old.cancel_previous_runs
            AND newest.pull_request_number IS NOT NULL
            AND old.team_id = newest.team_id
            AND old.installation_id = newest.installation_id
            AND old.github_base_url = newest.github_base_url
            AND lower(old.owner) = lower(newest.owner) AND lower(old.repo) = lower(newest.repo)
            AND old.pull_request_number = newest.pull_request_number
            AND old.workflow_file_name = newest.workflow_file_name
            AND old.commit_sha <> newest.commit_sha
        )
      )
      AND dispatch.active_job_id = old.id AND dispatch.finished_at IS NULL
      AND (dispatch.state <> 'finishing' OR dispatch.outcome = 'blocked')
    """
    params: [
      { _expr: "response.jobs" }
      $cancelClosedPullRequest
      { _expr: "response.query.connection == null ? '' : response.query.connection.teamId" }
      { _expr: "response.query.connection == null ? '' : string(response.query.connection.installationId)" }
      $githubBaseUrl
      $owner
      $repo
      $pullRequestNumber
    ]
  ) @redact
  cancelled: _execute(
    sql: """
    UPDATE build_jobs AS old SET
      status = 'CANCELLED', superseded_by_task_id = $9,
      updated_at = $10::bigint,
      completed_at = CASE WHEN old.status = 'QUEUED' AND old.latest_run_id IS NULL
        THEN $10::bigint ELSE old.completed_at END
    WHERE old.status IN ('QUEUED', 'IN_PROGRESS')
      AND (
        ($2::boolean AND old.team_id = $3 AND old.installation_id = $4
          AND old.github_base_url = $5
          AND lower(old.owner) = lower($6::text) AND lower(old.repo) = lower($7::text)
          AND old.pull_request_number = $8::bigint)
        OR EXISTS (
          SELECT 1 FROM build_jobs AS newest
          WHERE newest.id IN (SELECT w.id FROM jsonb_to_recordset($1::jsonb) AS w(id text))
            AND newest.cancel_previous_runs AND old.cancel_previous_runs
            AND newest.pull_request_number IS NOT NULL
            AND old.team_id = newest.team_id
            AND old.installation_id = newest.installation_id
            AND old.github_base_url = newest.github_base_url
            AND lower(old.owner) = lower(newest.owner) AND lower(old.repo) = lower(newest.repo)
            AND old.pull_request_number = newest.pull_request_number
            AND old.workflow_file_name = newest.workflow_file_name
            AND old.commit_sha <> newest.commit_sha
        )
      )
      AND NOT EXISTS (
        SELECT 1 FROM build_job_dispatches AS dispatch
        WHERE dispatch.active_job_id = old.id AND dispatch.finished_at IS NULL
          AND dispatch.state = 'finishing' AND dispatch.outcome <> 'blocked'
      )
    """
    params: [
      { _expr: "response.jobs" }
      $cancelClosedPullRequest
      { _expr: "response.query.connection == null ? '' : response.query.connection.teamId" }
      { _expr: "response.query.connection == null ? '' : string(response.query.connection.installationId)" }
      $githubBaseUrl
      $owner
      $repo
      $pullRequestNumber
      $id
      { _expr: "int(request.time)" }
    ]
  )
  # Bulk _Data inputs are not supported by the Admin SDK generator; use the
  # same parameterized jsonb_to_recordset strategy as the jobs above.
  skipped: _executeReturning(
    sql: """
    INSERT INTO skipped_workflow_checks (
      id, webhook_task_id, connection_id, owner, repo, workflow_name,
      workflow_file_name, commit_sha, comparison_base_sha, github_base_url,
      status, next_attempt_at, created_at, updated_at
    )
    SELECT w.id, $2, $3, $4, $5, w.name, w.file, $6, $7, $8,
      'pending', to_timestamp($9::bigint), $9::bigint, $9::bigint
    FROM jsonb_to_recordset($1::jsonb) AS w(id text, name text, file text)
    WHERE length(trim(w.id)) > 0 AND length(trim(w.name)) > 0
      AND length(w.file) > 0 AND length($4::text) > 0 AND length($5::text) > 0
      AND length($6::text) > 0 AND length($7::text) > 0 AND length($8::text) > 0
      AND NOT EXISTS (
        SELECT 1 FROM jsonb_to_recordset($10::jsonb) AS j(file text)
        WHERE j.file = w.file
      )
    ON CONFLICT (id) DO UPDATE SET id = EXCLUDED.id
    RETURNING id
    """
    params: [
      $skippedJson
      $id
      $connectionId
      $owner
      $repo
      $commitSha
      $comparisonBaseSha
      $githubBaseUrl
      { _expr: "int(request.time)" }
      $jobsJson
    ]
  ) @check(expr: "size(this) == vars.skippedCount", message: "Invalid skipped workflow batch")
}

# Only permanent input/configuration errors terminate a task. Infrastructure
# failures are retried by the trigger without claiming or stranding the task.
mutation RejectWebhookTask($id: String!, $reason: String!) @auth(level: NO_ACCESS) @transaction {
  webhookTask_updateMany(
    where: { id: { eq: $id }, status: { eq: "pending" } }
    data: { status: "failed", errorMessage: $reason, updatedAt_expr: "int(request.time)" }
  )
    @check(
      expr: "vars.reason in ['invalid_payload', 'invalid_workflow', 'untrusted_pull_request']"
      message: "Invalid failure reason"
    )
}
