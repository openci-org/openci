# One batch belongs to one run and one optional step; stdout/stderr may be mixed.
# Functions group logs, read the write state, and allocate consecutive sequences.
mutation AppendBuildLogs(
  $teamId: String!
  $runId: String!
  $stepId: String = null
  $expectedLastSequence: Int64!
  $logs: [BuildLog_Data!]!
    @allow(
      fields: "runId sequence logId stepId source stream message occurredAt"
      maxCount: 100
    )
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    buildRun(id: $runId)
      @check(expr: "this != null", message: "Run not found")
      @check(
        expr: "size(vars.logs) >= 1 && int(vars.expectedLastSequence) >= 0 && int(vars.expectedLastSequence) <= 9223372036854775807 - size(vars.logs)"
        message: "Invalid batch size or sequence"
      )
      @check(
        expr: "vars.logs.all(l, has(l.runId) && l.runId == vars.runId && has(l.sequence) && int(l.sequence) > int(vars.expectedLastSequence) && int(l.sequence) <= int(vars.expectedLastSequence) + size(vars.logs) && has(l.logId) && l.logId != null && (has(l.stepId) ? l.stepId : null) == vars.stepId)"
        message: "Log identity, step, or sequence does not match the batch"
      )
      @check(
        expr: "vars.logs.all(l, has(l.source) && l.source in ['worker', 'workflow'] && has(l.stream) && l.stream in ['stdout', 'stderr'] && has(l.message) && l.message != null && size(bytes(l.message)) <= 16384 && has(l.occurredAt) && l.occurredAt != null)"
        message: "Invalid log source, stream, message, or event time"
      ) {
      ...LogWriteScope
    }
    buildStep(
      first: { where: { runId: { eq: $runId }, stepId: { eq: $stepId } } }
    )
      @check(
        expr: "vars.stepId == null || this != null"
        message: "Step does not belong to this run"
      ) {
      stepId
    }
  }
  # CAS plus the primary key guarantees a gap-free committed sequence. A failed
  # insert/check rolls back this increment as well as every row in the batch.
  buildRun_updateMany(
    where: {
      _and: [
        { id: { eq: $runId }, lastLogSequence: { eq: $expectedLastSequence } }
        {
          _or: [
            { logsExpireAt: { isNull: true } }
            { logsExpireAt: { gt_expr: "request.time" } }
          ]
        }
      ]
    }
    data: {
      # CEL arguments can be evaluated before @check; avoid overflow first.
      lastLogSequence_expr: "int(vars.expectedLastSequence) <= 9223372036854775807 - size(vars.logs) ? int(vars.expectedLastSequence) + size(vars.logs) : int(vars.expectedLastSequence)"
    }
  )
    @check(
      expr: "this == 1"
      message: "Log sequence changed; read write state and retry"
    )
  buildLog_insertMany(data: $logs)
}
