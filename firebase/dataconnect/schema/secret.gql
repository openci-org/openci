type SecretReference @table(name: "secret_references", key: ["teamId", "name"]) {
  teamId: String! @col(name: "team_id")
  team: Team! @ref(fields: "teamId", references: "id")
  name: String!
  secretVersionPath: String! @col(name: "secret_version_path")
  createdAt: Int64! @col(name: "created_at")
  updatedAt: Int64! @col(name: "updated_at")
}

# Retired versions remain readable for in-flight builds before destruction.
type SecretVersionCleanup @table(name: "secret_version_cleanup", key: "path") {
  path: String!
  deleteAfter: Timestamp! @col(name: "delete_after") @index
}
