type GitHubConnection
  @table(name: "github_connections", key: "id")
  @unique(fields: ["githubApiBaseUrl", "githubAppId", "installationId"]) {
  id: String!
  teamId: String! @col(name: "team_id")
  team: Team! @ref(fields: "teamId", references: "id")
  githubApiBaseUrl: String! @col(name: "github_api_base_url")
  githubAppId: Int64! @col(name: "github_app_id")
  installationId: Int64! @col(name: "installation_id")
  accountId: Int64! @col(name: "account_id")
  # Drift stores User / Organization as text.
  accountType: String! @col(name: "account_type")
  accountLogin: String! @col(name: "account_login")
  verifiedByUserId: String! @col(name: "verified_by_user_id")
  verifiedByGitHubUserId: Int64! @col(name: "verified_by_github_user_id")
  # Drift stores DateTime as Unix seconds.
  verifiedAt: Int64! @col(name: "verified_at")
  # Drift stores active / suspended / removed as text.
  status: String!
}

type GitHubConnectionRequest
  @table(name: "github_connection_requests", key: "id")
  @index(fields: ["expiresAt"]) {
  id: String!
  userId: String! @col(name: "user_id")
  teamId: String! @col(name: "team_id")
  team: Team! @ref(fields: "teamId", references: "id")
  stateHash: String! @col(name: "state_hash") @unique
  # PKCE verifier values belong in Secret Manager, not SQL Connect.
  codeVerifierSecretVersionPath: String! @col(name: "code_verifier_secret_version_path")
  createdAt: Int64! @col(name: "created_at")
  expiresAt: Int64! @col(name: "expires_at")
}

type GitHubConnectionSession
  @table(name: "github_connection_sessions", key: "id")
  @index(fields: ["expiresAt"]) {
  id: String!
  userId: String! @col(name: "user_id")
  teamId: String! @col(name: "team_id")
  team: Team! @ref(fields: "teamId", references: "id")
  githubUserId: Int64! @col(name: "github_user_id")
  referenceHash: String! @col(name: "reference_hash") @unique
  # Clear the reference on consumption/expiry; destroy the secret separately.
  accessTokenSecretVersionPath: String @col(name: "access_token_secret_version_path")
  createdAt: Int64! @col(name: "created_at")
  expiresAt: Int64! @col(name: "expires_at")
  consumedAt: Int64 @col(name: "consumed_at")
}
