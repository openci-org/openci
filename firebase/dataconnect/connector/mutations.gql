  $token: String!
  $expiresAt: Timestamp!
) @auth(level: USER) @transaction {
  query @redact {
    teamMember(key: { teamId: $teamId, userId_expr: "auth.uid" })
      @check(expr: "this != null", message: "You are not a member of this team") {
      teamId
    }
  }
  invitation_update(
    key: { id: $id }
    data: {
      token: $token
      expiresAt: $expiresAt
      invitedById_expr: "auth.uid"
      updatedAt_expr: "request.time"
    }
  )
}


