mutation CreateTeamForCurrentUser($id: String!, $name: String!)
  @auth(level: USER) {
  createTeam: _execute(
    sql: """
      WITH upsert_user AS (
        INSERT INTO "user" (id, email, selected_team_id, created_at, updated_at)
        VALUES ($1, $2, $3, NOW(), NOW())
        ON CONFLICT (id) DO UPDATE
        SET
          email = EXCLUDED.email,
          selected_team_id = EXCLUDED.selected_team_id,
          updated_at = NOW()
      ),
      insert_team AS (
        INSERT INTO team (id, name, members, created_at, updated_at)
        VALUES ($3, $4, ARRAY[$1]::text[], NOW(), NOW())
      )
      INSERT INTO team_member (team_id, user_id, joined_at)
      VALUES ($3, $1, NOW())
      ON CONFLICT (team_id, user_id) DO NOTHING
    """
    params: [{ _expr: "auth.uid" }, { _expr: "auth.token.email" }, $id, $name]
  )
}


