mutation ClaimQueuedBuildJob($runsOnPattern: String!) @auth(level: NO_ACCESS) {
  job: _executeReturningFirst(
    sql: """
      UPDATE build_job
      SET status = 'IN_PROGRESS', updated_at = NOW()
      WHERE id = (
        SELECT id
        FROM build_job
        WHERE status = 'QUEUED' AND runs_on LIKE $1
        ORDER BY created_at ASC
        LIMIT 1
        FOR UPDATE SKIP LOCKED
      )
      RETURNING
        id,
        status,
        owner,
        repo,
        team_id AS "teamId",
        workflow_id AS "workflowId",
        workflow_file_name AS "workflowFileName",
        workflow_name AS "workflowName",
        job_key AS "jobKey",
        workflow_run_id AS "workflowRunId",
        needs,
        resolved_needs AS "resolvedNeeds",
        installation_id::text AS "installationId",
        installation_token AS "installationToken",
        token_expires_at AS "tokenExpiresAt",
        check_run_id::text AS "checkRunId",
        commit_sha AS "commitSha",
        pull_request_number AS "pullRequestNumber",
        event,
        action,
        sender,
        repository,
        tag_name AS "tagName",
        branch,
        release_name AS "releaseName",
        runs_on AS "runsOn",
        run_count AS "runCount",
        latest_run_id AS "latestRunId",
        github_api_base_url AS "githubApiBaseUrl",
        github_base_url AS "githubBaseUrl",
        created_at AS "createdAt",
        updated_at AS "updatedAt",
        completed_at AS "completedAt"
    """
    params: [$runsOnPattern]
  )
}


mutation CreateBuildRunForWorker($buildJobId: String!, $id: String!) @auth(level: NO_ACCESS) @transaction {
  buildRun_upsert(
    data: {
      buildJobId: $buildJobId
      id: $id
      status: "in_progress"
      updatedAt_expr: "request.time"
    }
  )
  buildJob_update(
    id: $buildJobId
    data: {
      latestRunId: $id
      runCount_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  )
}


mutation UpdateBuildRunStatusForWorker(
  $buildJobId: String!
  $runId: String!
  $status: String!
  $conclusion: String
) @auth(level: NO_ACCESS) {
  buildRun_update(
    key: { buildJobId: $buildJobId, id: $runId }
    data: {
      status: $status
      conclusion: $conclusion
      updatedAt_expr: "request.time"
    }
  )
}


mutation AppendBuildLogForWorker(
  $buildJobId: String!
  $runId: String!
  $id: String!
  $message: String!
  $level: String!
  $timestamp: Timestamp!
  $stackTrace: String
) @auth(level: NO_ACCESS) {
  buildLog_upsert(
    data: {
      buildRunBuildJobId: $buildJobId
      buildRunId: $runId
      id: $id
      message: $message
      level: $level
      timestamp: $timestamp
      stackTrace: $stackTrace
    }
  )
}


mutation CompleteBuildJobForWorker($id: String!, $status: BuildJobStatus!, $completedAt: Timestamp!)
  @auth(level: NO_ACCESS) {
  buildJob_update(
    id: $id
    data: {
      status: $status
      completedAt: $completedAt
      updatedAt_expr: "request.time"
    }
  )
}


mutation UpdateEnvironmentVariableValueForWorker($id: String!, $value: String!)
  @auth(level: NO_ACCESS) {
  environmentVariable_update(
    id: $id
    data: {
      value: $value
      updatedAt_expr: "request.time"
    }
  )
}


mutation UpdateBuildJobStatus($id: String!, $status: BuildJobStatus!) @auth(level: NO_ACCESS) {
  buildJob_update(id: $id, data: { status: $status, updatedAt_expr: "request.time" })
}


mutation UpdateBuildJobFailureSummary(
  $id: String!
  $failureSummaryStatus: String!
  $failureSummary: String
  $failureSummaryModel: String
  $failureSummaryDurationMs: Int
) @auth(level: NO_ACCESS) {
  buildJob_update(
    id: $id
    data: {
      failureSummaryStatus: $failureSummaryStatus
      failureSummary: $failureSummary
      failureSummaryModel: $failureSummaryModel
      failureSummaryDurationMs: $failureSummaryDurationMs
      updatedAt_expr: "request.time"
    }
  )
}
