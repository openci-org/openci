mutation CreateInvitation(
  $email: String!
  $teamId: String!
  $teamNameSnapshot: String!
  $token: String!
  $expiresAt: Timestamp!
) @auth(level: USER) @transaction {
  query @redact {
    teamMember(key: { teamId: $teamId, userId_expr: "auth.uid" })
      @check(expr: "this != null", message: "You are not a member of this team") {
      teamId
    }
  }
  invitation_insert(
    data: {
      email: $email
      teamId: $teamId
      teamNameSnapshot: $teamNameSnapshot
      token: $token
      expiresAt: $expiresAt
      invitedById_expr: "auth.uid"
    }
  )
}


mutation ReinviteInvitation(
  $id: String!
