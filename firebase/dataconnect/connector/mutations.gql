mutation AcceptInvitationAndJoinTeam($id: String!, $teamId: String!)
  @auth(level: USER_EMAIL_VERIFIED) {

  user_upsert(
    data: {
      id_expr: "auth.uid"
      email_expr: "auth.token.email"
      updatedAt_expr: "request.time"
    }
  )

  invitation_update(
    key: { id: $id }
    data: {
      status: ACCEPTED
      acceptedById_expr: "auth.uid"
      acceptedAt_expr: "request.time"
      updatedAt_expr: "request.time"
    }
  )

  teamMember_upsert(
    data: {
      teamId: $teamId
      userId_expr: "auth.uid"
    }
  )
}


