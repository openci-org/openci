    githubApiBaseUrl
    githubBaseUrl
    createdAt
    updatedAt
    completedAt
    failureSummaryStatus
    failureSummary
    failureSummaryModel
    failureSummaryDurationMs
  }
}


query ListBuildJobsForTeam($teamId: String!, $limit: Int!)
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateBuildJob", condition: "request.variables.teamId == mutation.variables.teamId" })
  @refresh(onMutationExecuted: { operation: "UpsertBuildJobFromFirestore", condition: "request.variables.teamId == mutation.variables.teamId" })
  @refresh(onMutationExecuted: { operation: "UpdateBuildJobStatus" })
  @refresh(onMutationExecuted: { operation: "UpdateBuildJobFailureSummary" })
  @refresh(onMutationExecuted: { operation: "CompleteBuildJobForWorker" }) {
  teamMember(key: { teamId: $teamId, userId_expr: "auth.uid" })
    @check(expr: "this != null", message: "You are not a member of this team") {
    teamId
  }
  buildJobs(
    where: { teamId: { eq: $teamId } }
    orderBy: [{ createdAt: DESC }]
    limit: $limit
  ) {
    id
    status
    owner
    repo
    teamId
    workflowId
    workflowFileName
    workflowName
    jobKey
    workflowRunId
    needs
    commitSha
    pullRequestNumber
    tagName
    branch
    runCount
    latestRunId
    createdAt
    updatedAt
    completedAt
    failureSummaryStatus
    failureSummary
    failureSummaryModel
    failureSummaryDurationMs
  }
}


