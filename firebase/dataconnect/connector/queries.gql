query ListEnvironmentVariablesForTeam($teamId: String!)
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateEnvironmentVariable", condition: "request.variables.teamId == mutation.variables.teamId" })
  @refresh(onMutationExecuted: { operation: "UpdateEnvironmentVariable" })
  @refresh(onMutationExecuted: { operation: "DeleteEnvironmentVariable" }) {
  teamMember(key: { teamId: $teamId, userId_expr: "auth.uid" }) @redact
    @check(expr: "this != null", message: "You are not a member of this team") {
    teamId
  }
  environmentVariables(
    where: { teamId: { eq: $teamId } }
    orderBy: [{ key: ASC }]
  ) {
    id
    key
    value
    teamId
    autoIncrement
    createdAt
    updatedAt
  }
}


