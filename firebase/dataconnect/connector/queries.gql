query GetSecretsByNames($teamId: String!, $names: [String!]!) @auth(level: NO_ACCESS) {
  secrets(where: { _and: [{ teamId: { eq: $teamId } }, { name: { in: $names } }] }) {
    id
    name
    teamId
    pathToSecret
  }
}


query GetSecretsByNamesForTeam($teamId: String!, $names: [String!]!)
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateSecretMetadata", condition: "request.variables.teamId == mutation.variables.teamId" })
  @refresh(onMutationExecuted: { operation: "UpdateSecretMetadata" })
  @refresh(onMutationExecuted: { operation: "DeleteSecretMetadata" }) {
  teamMember(key: { teamId: $teamId, userId_expr: "auth.uid" })
    @check(expr: "this != null", message: "You are not a member of this team") {
    teamId
  }
  secrets(where: { _and: [{ teamId: { eq: $teamId } }, { name: { in: $names } }] }) {
    id
    name
    teamId
    pathToSecret
  }
}


