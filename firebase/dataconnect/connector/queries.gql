query GetInvitationByToken($token: String!) @auth(level: USER) {
  invitations(where: { token: { eq: $token } }, limit: 1) {
    id
    email
    status
    expiresAt
    createdAt
    teamNameSnapshot
    team {
      id
      name
    }
    invitedBy {
      id
      email
    }
  }
}


query ListMyPendingInvitations
  @auth(
    level: USER_EMAIL_VERIFIED
    insecureReason: "Invitations are addressed by email, not uid. Scoping is enforced via `email = auth.token.email` which is server-verified."
  ) {
  invitations(
    where: {
      _and: [
        { email: { eq_expr: "auth.token.email" } }
        { status: { eq: PENDING } }
      ]
    }
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    teamNameSnapshot
    expiresAt
    createdAt
    team {
      id
      name
    }
  }
}


query GetCurrentUser
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "UpdateCurrentUserSelectedTeam", condition: "request.auth.uid == mutation.auth.uid" })
  @refresh(onMutationExecuted: { operation: "UpdateCurrentUserNotificationPreference", condition: "request.auth.uid == mutation.auth.uid" })
  @refresh(onMutationExecuted: { operation: "UpdateCurrentUserFcmTokens", condition: "request.auth.uid == mutation.auth.uid" })
  @refresh(onMutationExecuted: { operation: "AddCurrentUserFcmToken", condition: "request.auth.uid == mutation.auth.uid" })
  @refresh(onMutationExecuted: { operation: "UpdateCurrentUserRepositorySelection", condition: "request.auth.uid == mutation.auth.uid" })
  @refresh(onMutationExecuted: { operation: "UpdateCurrentUserSelectedBranch", condition: "request.auth.uid == mutation.auth.uid" }) {
  user(id_expr: "auth.uid") {
    id
    selectedTeamId
    notificationPreference
    fcmTokens
    selectedRepository
    selectedBranch
  }
}


query ListMyTeams
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "CreateTeamForCurrentUser", condition: "request.auth.uid == mutation.auth.uid" })
  @refresh(onMutationExecuted: { operation: "UpdateTeamName" })
  @refresh(onMutationExecuted: { operation: "UpdateTeamAiEnabled" })
  @refresh(onMutationExecuted: { operation: "DeleteTeam" }) {
  teamMembers(where: { userId: { eq_expr: "auth.uid" } }) {
    team {
      id
      name
      members
      installationIds
      aiEnabled
      createdAt
      updatedAt
    }
  }
}


query ListTeamPendingInvitations($teamId: String!) @auth(level: USER) {
  teamMember(key: { teamId: $teamId, userId_expr: "auth.uid" })
    @check(expr: "this != null", message: "You are not a member of this team") {
    teamId
  }

  invitations(
    where: {
      _and: [
        { teamId: { eq: $teamId } }
        { status: { eq: PENDING } }
      ]
    }
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    email
    createdAt
    expiresAt
    invitedBy {
      id
      email
    }
  }
}


query FindExistingPendingInvitation($email: String!, $teamId: String!)
  @auth(level: USER) {
  invitations(
    where: {
      _and: [
        { email: { eq: $email } }
        { teamId: { eq: $teamId } }
        { status: { eq: PENDING } }
      ]
    }
    limit: 1
  ) {
    id
    token
    expiresAt
  }
}


