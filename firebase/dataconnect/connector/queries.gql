query ListBuildLogsForRun($buildJobId: String!, $runId: String!, $teamId: String!)
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "UpsertBuildLogFromFirestore", condition: "request.variables.buildJobId == mutation.variables.buildJobId && request.variables.runId == mutation.variables.runId" })
  @refresh(onMutationExecuted: { operation: "AppendBuildLogForWorker", condition: "request.variables.buildJobId == mutation.variables.buildJobId && request.variables.runId == mutation.variables.runId" }) {
  teamMember(key: { teamId: $teamId, userId_expr: "auth.uid" })
    @check(expr: "this != null", message: "You are not a member of this team") {
    teamId
  }
  buildLogs(
    where: {
      _and: [
        { buildRunBuildJobId: { eq: $buildJobId } }
        { buildRunId: { eq: $runId } }
      ]
    }
    orderBy: [{ timestamp: ASC }]
  ) {
    id
    message
    level
    timestamp
  }
}


query ListLatestBuildLogs($buildJobId: String!, $runId: String!, $limit: Int!)
  @auth(level: NO_ACCESS) {
  buildLogs(
    where: {
      _and: [
        { buildRunBuildJobId: { eq: $buildJobId } }
        { buildRunId: { eq: $runId } }
      ]
    }
    orderBy: [{ timestamp: DESC }]
    limit: $limit
  ) {
    id
    message
    timestamp
  }
}


