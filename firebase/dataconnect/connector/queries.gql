query ListWorkflowFilesForBranch($teamId: String!, $repository: String!, $branch: String!)
  @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "UpsertWorkflowFile", condition: "request.variables.teamId == mutation.variables.teamId && request.variables.repository == mutation.variables.repository && request.variables.branch == mutation.variables.branch" })
  @refresh(onMutationExecuted: { operation: "UpdateWorkflowFileEnabled" })
  @refresh(onMutationExecuted: { operation: "DeleteWorkflowFile" }) {
  teamMember(key: { teamId: $teamId, userId_expr: "auth.uid" })
    @check(expr: "this != null", message: "You are not a member of this team") {
    teamId
  }
  workflowFiles(
    where: {
      _and: [
        { teamId: { eq: $teamId } }
        { repository: { eq: $repository } }
        { branch: { eq: $branch } }
      ]
    }
  ) {
    id
    fileName
    filePath
    content
    enabled
  }
}


