fragment SecretActor on Query {
  teamMember(first: { where: { teamId: { eq: $teamId }, userId: { eq: $actorUid } } })
    @check(expr: "this != null", message: "Team access denied") {
    id
  }
}

query GetManagedSecretContext($teamId: String!, $actorUid: String!) @auth(level: NO_ACCESS) {
  ...SecretActor
  secrets: secretReferences(where: { teamId: { eq: $teamId } }, limit: null) {
    name
    secretVersionPath
    createdAt
    updatedAt
  }
}

# Serialize writes on a team row, then recheck membership and the previous value.
mutation CommitManagedSecret(
  $teamId: String!
  $actorUid: String!
  $name: String!
  $expectedPath: String
  $path: String!
) @auth(level: NO_ACCESS) @transaction {
  team_update(key: { id: $teamId }, data: { updatedAt_expr: "int(request.time)" })
    @check(expr: "this != null", message: "Team access denied")
  query @redact {
    ...SecretActor
    previous: secretReference(key: { teamId: $teamId, name: $name })
      @check(
        expr: "this == null ? vars.expectedPath == null : this.secretVersionPath == vars.expectedPath"
        message: "Secret changed; reload and retry"
      ) {
      secretVersionPath
      createdAt
    }
    existing: secretReferences(where: { teamId: { eq: $teamId } }, limit: null)
      @check(
        expr: "size(this) < 100 || this.exists(s, s.name == vars.name)"
        message: "Too many team secrets"
      ) {
      name
    }
  }
  secretReference_upsert(
    data: {
      teamId: $teamId
      name: $name
      secretVersionPath: $path
      createdAt_expr: "response.query.previous == null ? int(request.time) : response.query.previous.createdAt"
      updatedAt_expr: "int(request.time)"
    }
  )
}

mutation RenameManagedSecret(
  $teamId: String!
  $actorUid: String!
  $name: String!
  $newName: String!
  $expectedPath: String!
  $path: String
) @auth(level: NO_ACCESS) @transaction {
  team_update(key: { id: $teamId }, data: { updatedAt_expr: "int(request.time)" })
    @check(expr: "this != null", message: "Team access denied")
  query @redact {
    ...SecretActor
    previous: secretReference(key: { teamId: $teamId, name: $name })
      @check(
        expr: "this != null && this.secretVersionPath == vars.expectedPath"
        message: "Secret changed; reload and retry"
      ) {
      createdAt
      secretVersionPath
    }
    target: secretReference(key: { teamId: $teamId, name: $newName })
      @check(expr: "this == null", message: "Secret name already exists") {
      name
    }
  }
  secretReference_delete(key: { teamId: $teamId, name: $name })
  secretReference_insert(
    data: {
      teamId: $teamId
      name: $newName
      secretVersionPath_expr: "vars.path == null ? vars.expectedPath : vars.path"
      createdAt_expr: "response.query.previous.createdAt"
      updatedAt_expr: "int(request.time)"
    }
  )
}

mutation DeleteManagedSecret(
  $teamId: String!
  $actorUid: String!
  $name: String!
  $expectedPath: String!
) @auth(level: NO_ACCESS) @transaction {
  team_update(key: { id: $teamId }, data: { updatedAt_expr: "int(request.time)" })
    @check(expr: "this != null", message: "Team access denied")
  query @redact {
    ...SecretActor
  }
  secretReference_deleteMany(
    where: {
      teamId: { eq: $teamId }
      name: { eq: $name }
      secretVersionPath: { eq: $expectedPath }
    }
  ) @check(expr: "this == 1", message: "Secret changed; reload and retry")
}

mutation QueueSecretVersionCleanup($path: String!) @auth(level: NO_ACCESS) {
  secretVersionCleanup_upsert(
    data: { path: $path, deleteAfter_expr: "request.time + duration('86400s')" }
  )
}

query GetDueSecretVersions @auth(level: NO_ACCESS) {
  versions: secretVersionCleanups(
    where: { deleteAfter: { le_expr: "request.time" } }
    orderBy: { deleteAfter: ASC }
    limit: 50
  ) {
    path
  }
}

query GetSecretVersionReferences($path: String!) @auth(level: NO_ACCESS) {
  references: secretReferences(where: { secretVersionPath: { eq: $path } }, limit: 1) {
    name
  }
}

mutation CompleteSecretVersionCleanup($path: String!) @auth(level: NO_ACCESS) {
  secretVersionCleanup_delete(key: { path: $path })
}
