# Clients list metadata only; Secret Manager paths stay server-only.
query GetSecrets($teamId: String!) @auth(level: USER) @refresh(every: { seconds: 10 }) {
  teamMembers(where: { teamId: { eq: $teamId }, userId: { eq_expr: "auth.uid" } }, limit: 1)
    @redact
    @check(expr: "size(this) == 1", message: "Team access denied") {
    id
  }
  secrets: secretReferences(
    where: { teamId: { eq: $teamId } }
    orderBy: { name: ASC }
    limit: null
  ) {
    teamId
    name
    createdAt
    updatedAt
  }
}
