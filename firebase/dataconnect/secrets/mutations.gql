# Functions verifies caller membership and supplies the version path returned by
# Secret Manager. Clients must never supply an arbitrary reference path.
mutation CreateSecretReference($teamId: String!, $name: String!, $secretVersionPath: String!)
@auth(level: NO_ACCESS)
@transaction {
  query @redact {
    team(key: { id: $teamId }) @check(expr: "this != null", message: "Team not found") {
      id
    }
  }
  secretReference_insert(
    data: {
      teamId: $teamId
      name: $name
      secretVersionPath: $secretVersionPath
      createdAt_expr: "int(request.time)"
      updatedAt_expr: "int(request.time)"
    }
  )
    @check(expr: "vars.name.matches('[^[:space:]]')", message: "Secret name must not be blank")
    @check(
      expr: "vars.secretVersionPath.matches('^projects/[a-zA-Z0-9-]+/(locations/[a-z0-9-]+/)?secrets/[a-zA-Z0-9_-]+/versions/[1-9][0-9]*$')"
      message: "A numeric Secret Manager version path is required"
    )
}

mutation UpdateSecretReference(
  $teamId: String!
  $name: String!
  $expectedSecretVersionPath: String!
  $secretVersionPath: String!
) @auth(level: NO_ACCESS) @transaction {
  # Match the previous version in the write itself so concurrent updates conflict.
  secretReference_updateMany(
    where: {
      teamId: { eq: $teamId }
      name: { eq: $name }
      secretVersionPath: { eq: $expectedSecretVersionPath }
    }
    data: { secretVersionPath: $secretVersionPath, updatedAt_expr: "int(request.time)" }
  )
    @check(expr: "this == 1", message: "Secret reference not found or changed")
    @check(
      expr: "vars.secretVersionPath.matches('^projects/[a-zA-Z0-9-]+/(locations/[a-z0-9-]+/)?secrets/[a-zA-Z0-9_-]+/versions/[1-9][0-9]*$')"
      message: "A numeric Secret Manager version path is required"
    )
}

mutation DeleteSecretReference(
  $teamId: String!
  $name: String!
  $expectedSecretVersionPath: String!
) @auth(level: NO_ACCESS) @transaction {
  secretReference_deleteMany(
    where: {
      teamId: { eq: $teamId }
      name: { eq: $name }
      secretVersionPath: { eq: $expectedSecretVersionPath }
    }
  ) @check(expr: "this == 1", message: "Secret reference not found or changed")
}
