name: github_webhook_processor
description: Processor for GitHub webhook events and build job orchestration in OpenCI.
version: 1.0.0
publish_to: none

environment:
  sdk: 3.11.5

resolution: workspace

dependencies:
  dart_jsonwebtoken: ^3.2.0
  drift: ^2.33.0
  drift_postgres: ^1.3.1
  github: ^9.25.1
  http: ^1.6.0
  logging: ^1.2.0
  openci_server: ^2.0.0
  openci_shared: ^1.0.1
  postgres: ^3.5.11
  retry: ^3.1.2
  sentry: ^9.22.0
  uuid: ^4.5.3
  yaml: ^3.1.2

dev_dependencies:
  build_runner: ^2.15.0
  lints: ^6.0.0
  mocktail: ^1.0.4
  path: ^1.9.0
  test: ^1.24.0
