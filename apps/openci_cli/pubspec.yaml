name: genuineci_cli
description: Command-line tools for OpenCI authentication, team switching, secrets, workflow paths, and local development.
version: 0.4.0
repository: https://github.com/openci-org/openci/tree/develop/apps/openci_cli
issue_tracker: https://github.com/openci-org/openci/issues

environment:
  sdk: ^3.11.5

resolution: workspace

dependencies:
  args: ^2.7.0
  characters: ^1.4.0
  cli_completion: ^0.5.1
  cli_util: ^0.5.0
  crypto: ^3.0.7
  dart_console_plus: ^1.0.0
  freezed_annotation: ^3.1.0
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  mason_logger: ^0.3.4
  meta: ^1.16.0
  openci_shared: ^1.0.6
  path: ^1.9.0
  pub_semver: ^2.2.0
  pub_updater: ^0.5.0
  slang: ^4.19.0
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.15.1
  freezed: 3.2.6-dev.1
  json_serializable: ^6.14.1
  lints: ^6.0.0
  openci_workflow: ^0.1.0
  test: ^1.25.6

executables:
  genuineci: genuineci_cli

# Firebase client configuration is public and is not an authentication token.
false_secrets:
  - /lib/src/auth/firebase_auth_client.dart
