  swipeable_page_route: ^0.4.8
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  wolt_modal_sheet: ^0.11.0
  xml: ^6.6.1
  yaml: ^3.1.3
  qr: ^3.0.2

dev_dependencies:
  build_runner: ^2.15.0
  checks: ^0.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3
  sentry_dart_plugin: ^3.3.0

flutter:
  uses-material-design: true

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: openci-inc
