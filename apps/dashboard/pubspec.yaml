name: dashboard
description: "OpenCI Dashboard App(iOS/macOS/Web)"

publish_to: "none"

version: 1.7.14+1

environment:
  flutter: ^3.41.6
  sdk: 3.11.5

resolution: workspace

dependencies:
  app_links: ^7.0.0
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.2.0
  cupertino_icons: ^1.0.9
  file_picker: ^12.0.0-beta.1
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  flutter_riverpod: ^3.3.1
  flutter_web_plugins:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  hooks_riverpod: ^3.3.1
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  material_symbols_icons: ^4.2928.1
  macos_updater:
    path: ../../packages/macos_updater
  openci_shared:
    path: ../../packages/openci_shared
  app_minimizer_plus:
    path: ../../packages/app_minimizer_plus
  package_info_plus: ^10.1.0
  purchases_flutter: ^10.0.2
  re_editor: ^0.8.0
  re_highlight: ^0.0.3
  riverpod_annotation: ^4.0.2
  sentry_flutter: ^9.20.0
  shared_preferences: ^2.5.5
