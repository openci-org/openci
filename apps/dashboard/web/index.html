<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OpenCI - Open Source CI/CD Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OpenCI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OpenCI</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload core Flutter assets to minimize initial loading time -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" crossorigin="anonymous">

  <style>
    :root {
      color-scheme: light;
      --openci-background: #f8fafc;
      --openci-border: #e2e8f0;
      --openci-text-primary: #0f172a;
      --openci-text-secondary: #475569;
      --openci-accent: #2563eb;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--openci-background);
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .app-loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--openci-background);
      transition:
        opacity 180ms ease,
        visibility 180ms ease;
      z-index: 9999;
    }

    .app-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    .app-loader__content {
      display: grid;
      justify-items: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
    }

    .app-loader__logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
    }

    .app-loader__text {
      display: grid;
      gap: 6px;
    }

    .app-loader__title {
      color: var(--openci-text-primary);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
    }

    .app-loader__message {
      color: var(--openci-text-secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    .app-loader__spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--openci-border);
      border-top-color: var(--openci-accent);
      border-radius: 50%;
      animation: app-loader-spin 800ms linear infinite;
    }

    @keyframes app-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loader,
      .app-loader__spinner {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div id="app-loader" class="app-loader" role="status" aria-live="polite">
    <div class="app-loader__content">
      <img
        class="app-loader__logo"
        src="icons/Icon-192.png"
        width="72"
        height="72"
        alt="OpenCI"
      >
      <div class="app-loader__text">
        <div class="app-loader__title">OpenCI</div>
        <div id="app-loader-message" class="app-loader__message">
          OpenCI を読み込み中...
        </div>
      </div>
      <div class="app-loader__spinner" aria-hidden="true"></div>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
