name: stacked_pr_app
description: A database-free GitHub App for stacked PRs on Firebase Functions.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.6
  dart_jsonwebtoken: ^3.4.1
  firebase_functions: 0.8.0
  googleapis_auth: ^2.3.1
  http: ^1.5.0
  path: ^1.9.1
  shelf: ^1.4.2

dev_dependencies:
  build_runner: ^2.7.0
  lints: ^6.0.0
  mockito: ^5.5.0
  test: ^1.26.3
