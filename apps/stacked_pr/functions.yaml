# Explicit manifest: the Dart SDK default OS-only image does not include Git.
specVersion: v1alpha1
params:
  - name: STACKED_PR_GITHUB_PRIVATE_KEY
    type: secret
  - name: STACKED_PR_WEBHOOK_SECRET
    type: secret
  - name: GITHUB_APP_ID
    type: string
  - name: GITHUB_URL
    type: string
    default: "https://github.ibm.com"
  - name: STACKED_PR_RUNTIME_SERVICE_ACCOUNT
    type: string
  - name: STACKED_PR_TASK_SERVICE_ACCOUNT
    type: string
  - name: STACKED_PR_WORKER_URL
    type: string
    default: ""
  - name: STACKED_PR_RESUME_AT
    type: string
    default: ""
  - name: ALLOWED_REPOSITORIES
    type: string
    default: "dims/dmis_mobile"
  - name: AUTO_RESTACK
    type: string
    default: "true"
requiredAPIs:
  - api: run.googleapis.com
    reason: Firebase Dart HTTP functions
  - api: cloudtasks.googleapis.com
    reason: Durable webhook processing and retries
endpoints:
  stacked-pr-webhook:
    platform: gcfv2
    region: [asia-northeast1]
    availableMemoryMb: 256
    cpu: 1
    timeoutSeconds: 30
    concurrency: 20
    minInstances: 0
    maxInstances: 3
    serviceAccount: '{{ params.STACKED_PR_RUNTIME_SERVICE_ACCOUNT }}'
    secretEnvironmentVariables:
      - key: GITHUB_WEBHOOK_SECRET
        secret: STACKED_PR_WEBHOOK_SECRET
    httpsTrigger:
      invoker: [public]
    baseImageUri: asia-northeast1-docker.pkg.dev/serverless-runtimes/google-24/runtimes/osonly24
    command: [./bin/server]
    entryPoint: stacked-pr-webhook
  stacked-pr-worker:
    platform: gcfv2
    region: [asia-northeast1]
    availableMemoryMb: 2048
    cpu: 1
    timeoutSeconds: 540
    concurrency: 1
    minInstances: 0
    maxInstances: 1
    serviceAccount: '{{ params.STACKED_PR_RUNTIME_SERVICE_ACCOUNT }}'
    secretEnvironmentVariables:
      - key: GITHUB_APP_PRIVATE_KEY
        secret: STACKED_PR_GITHUB_PRIVATE_KEY
    httpsTrigger:
      invoker: ['{{ params.STACKED_PR_TASK_SERVICE_ACCOUNT }}']
    baseImageUri: asia-northeast1-docker.pkg.dev/serverless-runtimes/google-24-full/runtimes/nodejs24
    command: [./bin/server]
    entryPoint: stacked-pr-worker
