name: build_job_planner
description: Planner for build jobs created from GitHub webhook events in OpenCI.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.11.5

resolution: workspace

dependencies:
  analyzer: ^12.1.0
  freezed_annotation: ^3.1.0
  glob: ^2.1.3
  logging: ^1.2.0
  openci_shared: ^1.0.1
  path: ^1.9.1
  sentry: ^9.22.0

dev_dependencies:
  build_runner: ^2.15.0
  freezed: 3.2.6-dev.1
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.24.0
